<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 구단 정보 - BASEBOT</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/player-detail.css">
    <link rel="stylesheet" href="../css/teams.css">
    <style>
        .league-title {
            font-size: 22px;
            font-weight: 900;
            color: #102d63;
            margin: 30px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #102d63;
        }
        .division-title {
            font-size: 16px;
            font-weight: 700;
            color: #444;
            margin: 20px 0 10px 0;
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .team-card {
            border: 1px solid #e1e7f0;
            background: #fff;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative; /* 뱃지 띄우기용 */
        }
        .team-card:hover {
            border-color: #102d63;
            box-shadow: 0 4px 12px rgba(16, 45, 99, 0.1);
            transform: translateY(-2px);
        }
        .team-logo-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .team-card-name {
            font-size: 14px;
            font-weight: 700;
            color: #222;
        }
        .team-card-city {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <main class="sub-container">
        <!-- 좌측 사이드바 -->
        <aside class="sub-sidebar">
            <div class="sub-sidebar-title">MLB 구단</div>
            <div class="sub-sidebar-line"></div>
            <nav class="sub-sidebar-menu">
                <a href="teams.html" class="active">30개 구단 전체</a>
                <a href="#al">아메리칸 리그 (AL)</a>
                <a href="#nl">내셔널 리그 (NL)</a>
            </nav>
        </aside>

        <!-- 우측 본문 -->
        <section class="sub-content">
            <div class="breadcrumb">
                <a href="../main.html">홈</a> &gt; <span>팀 정보</span>
            </div>

            <div class="content-header">
                <h2>MLB 30개 구단</h2>
                <p>원하시는 구단을 선택하여 소속 선수 명단과 세이버메트릭스 기록을 확인하세요.</p>
            </div>

            <div id="teamsContainer">
                <p style="padding: 40px; text-align: center; color: #888;">구단 데이터를 불러오는 중입니다...</p>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchTeams();
        });

        // 선호 구단 ID 조회 헬퍼
        async function getMyFavoriteTeamIdAsync() {
            try {
                const userStr = sessionStorage.getItem("user") || localStorage.getItem("user");
                if (userStr) {
                    const u = JSON.parse(userStr);
                    const uid = u.user_id || u.id;
                    if (uid) {
                        // DB에서 최신 선호 구단 ID 조회
                        const res = await fetch(`http://127.0.0.1:8000/api/predictions/users/${uid}/points`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.favorite_team_id) return Number(data.favorite_team_id);
                        }
                    }
                    if (u.favorite_team_id || u.team_id) return Number(u.favorite_team_id || u.team_id);
                }
            } catch (e) {}
            return null;
        }

        async function fetchTeams() {
            try {
                const [teamsRes, myFavTeamId] = await Promise.all([
                    fetch("http://127.0.0.1:8000/api/teams"),
                    getMyFavoriteTeamIdAsync()
                ]);

                if (!teamsRes.ok) throw new Error("API 호출 실패");
                const teams = await teamsRes.json();
                renderTeams(teams, myFavTeamId);
            } catch (err) {
                console.error("구단 데이터 로딩 에러:", err);
                document.getElementById("teamsContainer").innerHTML =
                    `<p style="padding: 40px; text-align: center; color: #d32f2f;">구단 데이터를 불러오지 못했습니다. 백엔드 서버(FastAPI)가 실행 중인지 확인해 주세요.</p>`;
            }
        }

        // 기존의 지구별 그리드 렌더링 유지 + 선호 구단 강조 클래스 및 뱃지 삽입
        function renderTeams(teams, myFavTeamId) {
            const structure = {
                "AL": { "East": [], "Central": [], "West": [] },
                "NL": { "East": [], "Central": [], "West": [] }
            };

            teams.forEach(t => {
                if (structure[t.league] && structure[t.league][t.division]) {
                    structure[t.league][t.division].push(t);
                }
            });

            let html = "";
            for (const [league, divs] of Object.entries(structure)) {
                const leagueId = league.toLowerCase();
                const leagueName = league === "AL" ? "아메리칸 리그 (American League)" : "내셔널 리그 (National League)";
                html += `<div class="league-title" id="${leagueId}">${leagueName}</div>`;

                for (const [div, teamList] of Object.entries(divs)) {
                    html += `<div class="division-title">${league} ${div} Division</div><div class="team-grid">`;
                    teamList.forEach(t => {
                        const isMyTeam = (myFavTeamId && Number(t.team_id) === Number(myFavTeamId));
                        html += `
                            <div class="team-card ${isMyTeam ? 'my-favorite-team' : ''}" onclick="location.href='team-detail.html?id=${t.team_id}'">
                                ${isMyTeam ? '<span class="fav-team-badge">★ MY 구단</span>' : ''}
                                <img src="${t.logo_url}" class="team-logo-img" alt="${t.team_name}">
                                <div class="team-card-name">${t.team_name}</div>
                                <div class="team-card-city">${t.city || ''}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            }
            document.getElementById("teamsContainer").innerHTML = html;
        }
    </script>

    <!-- 공통 스크립트 연결 (teams.js는 제거) -->
    <script src="../js/main.js"></script>
</body>
</html>
