<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내가 쓴 댓글 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="../css/common-page.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 마이페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/mypage.css">

    <!-- 내가 쓴 댓글 전용 CSS -->
    <link rel="stylesheet" href="/css/my-comments.css">
</head>

<body data-page="my-comments">

    <!-- Header -->
    <div id="header"></div>

    <!-- Main -->
    <main class="auth-main">
        <div class="auth-layout">

            <!-- Sidebar -->
            <div id="mypage-sidebar"></div>

            <!-- Content -->
            <section class="mypage-content my-comments-page">

                <!-- 페이지 제목 -->
                <div class="mypage-title">
                    <h1>내가 쓴 댓글</h1>
                    <p>
                        커뮤니티에서 내가 작성한 댓글을 확인하고 관리할 수 있습니다.
                    </p>
                </div>

                <!-- 댓글 목록 카드 -->
                <div class="mypage-box my-comments-box">

                    <!-- 카드 제목 -->
                    <div class="mypage-box-title my-comments-box-header">
                        <div>
                            <span class="my-comments-heading">댓글 목록</span>
                            <p>댓글을 선택하면 해당 게시글로 이동합니다.</p>
                        </div>

                        <div class="my-comments-badges">
                            <span class="my-comments-pill my-comments-total">총 0개</span>
                            <span class="my-comments-pill my-comments-likes">받은 좋아요 0</span>
                        </div>
                    </div>

                    <div class="mypage-box-body my-comments-body">

                        <!-- 댓글 / 답글 필터 -->
                        <div class="my-comments-tabs"
                             role="group"
                             aria-label="댓글 종류 필터">

                            <button type="button"
                                    class="my-comments-tab active"
                                    data-type="ALL"
                                    aria-pressed="true">
                                전체
                            </button>

                            <button type="button"
                                    class="my-comments-tab"
                                    data-type="COMMENT"
                                    aria-pressed="false">
                                댓글
                            </button>

                            <button type="button"
                                    class="my-comments-tab"
                                    data-type="REPLY"
                                    aria-pressed="false">
                                답글
                            </button>
                        </div>

                        <!-- 검색 / 정렬 -->
                        <div class="my-comments-toolbar">

                            <label class="my-comments-search">
                                <span class="sr-only">댓글 내용 또는 게시글 제목 검색</span>

                                <span class="my-comments-search-icon"
                                      aria-hidden="true">⌕</span>

                                <input type="search"
                                       id="myCommentsSearchInput"
                                       placeholder="댓글 내용 또는 게시글 제목 검색..."
                                       autocomplete="off">
                            </label>

                            <label class="my-comments-sort">
                                <span class="sr-only">댓글 정렬</span>

                                <select id="myCommentsSort">
                                    <option value="newest">최신 작성순</option>
                                    <option value="oldest">오래된 작성순</option>
                                    <option value="likes">좋아요 많은 순</option>
                                </select>
                            </label>

                        </div>

                        <!-- 목록 건수 -->
                        <div class="my-comments-list-heading">
                            <span id="myCommentsResultCount">댓글 0개</span>
                        </div>

                        <!-- JavaScript가 댓글을 표시하는 영역 -->
                        <ul class="activity-list my-comments-items">
                        </ul>

                        <!-- 목록이 없을 때 -->
                        <div id="my-comments-empty"
                             class="my-comments-empty"
                             style="display: none;">

                            <div class="my-comments-empty-icon"
                                 aria-hidden="true">✎</div>

                            <strong>작성한 댓글이 없습니다.</strong>

                            <p>
                                커뮤니티에서 첫 번째 댓글을 작성해 보세요.
                            </p>
                        </div>

                        <!-- 페이지 이동 -->
                        <nav id="my-comments-pagination"
                             class="my-comments-pager"
                             aria-label="내가 쓴 댓글 페이지 이동">
                        </nav>

                    </div>
                </div>

            </section>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- 공통 JS -->
    <script src="/js/main.js?v=20261019"></script>

    <!-- 마이페이지 공통 JS -->
    <script src="/js/mypage.js"></script>

    <!-- 내가 쓴 댓글 JS -->
    <script src="/js/my-comments.js"></script>

</body>
</html>
