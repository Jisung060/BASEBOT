<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 종합뉴스 - BASEBOT</title>
    <link rel="stylesheet" href="/css/main.css">

    <style>
        .news-section {
            padding: 40px 20px 60px;
            min-height: 600px;
        }
        .board-container {
            max-width: 1100px;
            margin: auto;
        }
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 18px;
        }
        .board-title-group {
            display: flex;
            flex-direction: column;
        }
        .board-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 26px;
            font-weight: 800;
        }
        .board-title:before {
            content: "";
            width: 6px;
            height: 24px;
            background: #0f4c81;
            border-radius: 2px;
        }
        .status-line {
            margin-top: 7px;
            font-size: 12px;
            color: #777;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 5px;
            border-radius: 50%;
            background: #24a148;
        }
        .status-dot.loading {
            background: #d99a00;
        }

        /* 검색 및 필터 영역 스타일 추가 */
        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .team-select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            background-color: #f8f9fa;
        }
        .team-select:focus {
            border-color: #0f4c81;
        }
        .search-input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #0f4c81; }
        .search-btn {
            background-color: #0f4c81;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .search-btn:hover { background-color: #0a355c; }

        .table-wrap {
            overflow-x: auto;
            border-top: 2px solid #222;
        }
        .board-table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            text-align: center;
        }
        .board-table th {
            padding: 14px 8px;
            background: #f7f7f7;
            border-bottom: 1px solid #ccc;
            font-size: 13px;
            font-weight: 800;
        }
        .board-table td {
            padding: 14px 8px;
            border-bottom: 1px solid #e5e5e5;
            font-size: 14px;
            vertical-align: middle;
        }
        .col-no { width: 7%; }
        .col-title { width: auto; text-align: left; }
        .col-ai { width: 125px; }
        .col-date { width: 145px; color: #777; font-size: 12px !important; }

        .title-link {
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: inherit;
        }
        .title-link:hover {
            color: #0f4c81;
            text-decoration: underline;
        }
        .new-badge {
            display: inline-block;
            margin-left: 7px;
            padding: 1px 5px;
            border-radius: 3px;
            background: #d92d20;
            color: white;
            font-size: 10px;
            font-weight: 800;
        }
        .team-badge {
            display: inline-block;
            margin-right: 5px;
            padding: 2px 6px;
            border-radius: 3px;
            background: #e9ecef;
            color: #495057;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #dee2e6;
        }
        .meta {
            margin-top: 4px;
            color: #999;
            font-size: 11px;
            display: flex;
            align-items: center;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .btn-ai, .btn-body {
            padding: 5px 9px;
            background: #fff;
            border: 1px solid #bbb;
            border-radius: 4px;
            color: #333;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-ai:hover, .btn-body:hover {
            border-color: #0f4c81;
            color: #0f4c81;
        }
        .btn-ai:disabled {
            opacity: .55;
            cursor: wait;
        }
        .detail-row { display: none; background: #fafafa; }
        .detail-row td { padding: 0; }
        .detail-box {
            margin: 12px 15px 18px;
            padding: 18px 20px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-left: 4px solid #0f4c81;
            text-align: left;
        }
        .detail-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .detail-meta {
            color: #888;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .article-content {
            white-space: pre-line;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }
        .summary-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8fbff;
            border: 1px solid #dcebf8;
            border-radius: 5px;
        }
        .summary-header {
            margin-bottom: 8px;
            color: #0f4c81;
            font-weight: 800;
        }
        .summary-text {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 13px;
        }
        .loading-message, .error-message {
            padding: 35px 15px;
            text-align: center;
            color: #777;
        }
        .error-message { color: #c62828; }
        .new-row { animation: newArticle .8s ease; }
        @keyframes newArticle { 0% { background: #eef7ff; } 100% { background: #fff; } }


        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .pagination button {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border: 1px solid #d0d5d9;
            background: #fff;
            color: #444;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #0f4c81;
            color: #0f4c81;
        }

        .pagination button.active {
            background: #0f4c81;
            border-color: #0f4c81;
            color: #fff;
        }

        .pagination button:disabled {
            color: #bbb;
            background: #f7f7f7;
            cursor: not-allowed;
        }

        .page-info {
            margin-left: 8px;
            color: #777;
            font-size: 12px;
        }

        @media(max-width:700px) {
            .news-section { padding: 20px 10px 40px; }
            .board-header { align-items: flex-start; flex-direction: column; gap: 15px; }
            .filter-group { width: 100%; flex-wrap: wrap; }
            .search-input { flex-grow: 1; }
        }
    </style>
</head>
<body>

    <div id="header"></div>

    <main class="news-section">
        <div class="board-container">
            <div class="board-header">
                <div class="board-title-group">
                    <h2 class="board-title">MLB 종합뉴스</h2>
                    <div class="status-line">
                        <span id="status-dot" class="status-dot"></span>
                        <span id="status-text">실시간 뉴스 연결 중...</span>
                    </div>
                </div>

                <!-- 카테고리 필터 및 검색창 영역 -->
                <div class="filter-group">
                    <select id="team-select" class="team-select" onchange="applyFilters()">
                        <option value="ALL">전체 구단</option>
                        <optgroup label="AL 동부">
                            <option value="양키스">뉴욕 양키스</option>
                            <option value="오리올스">볼티모어 오리올스</option>
                            <option value="레이스">탬파베이 레이스</option>
                            <option value="블루제이스">토론토 블루제이스</option>
                            <option value="레드삭스">보스턴 레드삭스</option>
                        </optgroup>
                        <optgroup label="AL 중부">
                            <option value="트윈스">미네소타 트윈스</option>
                            <option value="가디언스">클리블랜드 가디언스</option>
                            <option value="타이거즈">디트로이트 타이거즈</option>
                            <option value="화이트삭스">시카고 화이트삭스</option>
                            <option value="로열스">캔자스시티 로열스</option>
                        </optgroup>
                        <optgroup label="AL 서부">
                            <option value="애스트로스">휴스턴 애스트로스</option>
                            <option value="레인저스">텍사스 레인저스</option>
                            <option value="매리너스">시애틀 매리너스</option>
                            <option value="에인절스">LA 에인절스</option>
                            <option value="애슬레틱스">오클랜드 애슬레틱스</option>
                        </optgroup>
                        <optgroup label="NL 동부">
                            <option value="브레이브스">애틀랜타 브레이브스</option>
                            <option value="필리스">필라델피아 필리스</option>
                            <option value="말린스">마이애미 말린스</option>
                            <option value="메츠">뉴욕 메츠</option>
                            <option value="내셔널스">워싱턴 내셔널스</option>
                        </optgroup>
                        <optgroup label="NL 중부">
                            <option value="브루어스">밀워키 브루어스</option>
                            <option value="컵스">시카고 컵스</option>
                            <option value="레즈">신시내티 레즈</option>
                            <option value="파이어리츠">피츠버그 파이어리츠</option>
                            <option value="카디널스">세인트루이스 카디널스</option>
                        </optgroup>
                        <optgroup label="NL 서부">
                            <option value="다저스">LA 다저스</option>
                            <option value="다이아몬드백스">애리조나 다이아몬드백스</option>
                            <option value="파드리스">샌디에이고 파드리스</option>
                            <option value="자이언츠">샌프란시스코 자이언츠</option>
                            <option value="로키스">콜로라도 로키스</option>
                        </optgroup>
                    </select>
                    <input type="text" id="search-input" class="search-input" placeholder="뉴스 제목 검색..." onkeypress="handleSearch(event)">
                    <button class="search-btn" onclick="applyFilters()">검색</button>
                </div>
            </div>

            <div class="table-wrap">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th class="col-no">번호</th>
                            <th class="col-title">제목</th>
                            <th class="col-ai">기능</th>
                            <th class="col-date">등록일</th>
                        </tr>
                    </thead>
                    <tbody id="news-tbody">
                        <tr><td colspan="4" class="loading-message">최신 뉴스를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="pagination" class="pagination"></div>
        </div>
    </main>

    <div id="footer"></div>

    <script>
    async function loadComponents() {
        try {
            const headerRes = await fetch('/components/header.html');
            const footerRes = await fetch('/components/footer.html');

            if (headerRes.ok) {
                document.getElementById('header').innerHTML = await headerRes.text();
                updateLoginUI();
            }

            if (footerRes.ok) {
                document.getElementById('footer').innerHTML = await footerRes.text();
            }
        } catch (err) {
            console.error("컴포넌트 로드 실패:", err);
        }
    }


    // ============================================================
    // 로그인 상태
    // ============================================================

    function checkLoginStatus() {
        const userJson = localStorage.getItem("user");

        const loginButtonArea = document.getElementById("login-btn-area");
        const userArea = document.getElementById("user-info-area");

        if (userJson) {
            const user = JSON.parse(userJson);

            if (loginButtonArea) {
                loginButtonArea.style.display = "none";
            }

            if (userArea) {
                userArea.style.display = "block";
            }
        } else {
            if (loginButtonArea) {
                loginButtonArea.style.display = "block";
            }

            if (userArea) {
                userArea.style.display = "none";
            }
        }
    }


    loadComponents();


    // ============================================================
    // 뉴스 설정
    // ============================================================

    const API_BASE = "";
    const REFRESH_MS = 30000;

    let allNewsList = [];
    let filteredNewsList = [];

    let currentPage = 1;

    // 한 페이지당 10개
    const ITEMS_PER_PAGE = 10;

    // 현재 열려 있는 기사
    let openedArticleId = null;

    // 자동 갱신 타이머
    let newsRefreshTimer = null;

    // 실제 최신 기사만 NEW
    const NEW_WINDOW_HOURS = 24;

    window.addEventListener("DOMContentLoaded", () => {
    loadNews();

    // 30초마다 최신 뉴스 확인
    newsRefreshTimer = setInterval(() => {
        loadNews(true);
    }, REFRESH_MS);
});



    // ============================================================
    // 뉴스 불러오기
    // ============================================================

    async function loadNews(isRefresh = false) {
        const tbody = document.getElementById("news-tbody");
        const status = document.getElementById("status-text");
        const dot = document.getElementById("status-dot");

        status.textContent = "최신 뉴스 확인 중...";
        dot.classList.add("loading");

        try {
            const response = await fetch(
                `${API_BASE}/api/news/mlb?limit=50`,
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const result = await response.json();
            // 전체 뉴스 저장
            allNewsList = result.data || [];

            if (result.status !== "success") {
                throw new Error("뉴스 API 응답 오류");
            }

            // 현재 보고 있는 기사 기억
            const currentOpenedArticleId = openedArticleId;

            // 전체 뉴스 저장
            allNewsList = result.data || [];

            // 현재 필터 유지
            applyFilters(false);

            // 자동 갱신 후 현재 보고 있던 기사 다시 열기
            if (currentOpenedArticleId !== null) {
            restoreOpenedArticle(currentOpenedArticleId);
            }

            status.textContent =
                `실시간 연결됨 · 마지막 확인 ${new Date().toLocaleTimeString("ko-KR")} · 30초마다 자동 갱신`;

            dot.classList.remove("loading");

        } catch (error) {

            console.error(error);

            status.textContent =
                "뉴스 서버 연결 실패 · 30초 후 다시 시도합니다.";

            dot.classList.add("loading");

            if (typeof firstLoad === "undefined" || firstLoad) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="error-message">
                            뉴스 서버에 연결할 수 없습니다.<br>
                            FastAPI 서버가 실행 중인지 확인해주세요.
                        </td>
                    </tr>
                `;
            }
        }
    }

// ============================================================
// 자동 갱신 후 열려 있던 기사 복원
// ============================================================

function restoreOpenedArticle(newsId) {

    const articleIndex =
        filteredNewsList.findIndex(
            news => Number(news.id) === Number(newsId)
        );

    if (articleIndex === -1) {
        return;
    }

    const startIndex =
        (currentPage - 1) * ITEMS_PER_PAGE;

    const pageIndex =
        articleIndex - startIndex;

    if (
        pageIndex < 0 ||
        pageIndex >= ITEMS_PER_PAGE
    ) {
        return;
    }

    const detailRow =
        document.getElementById(
            `detail-row-${pageIndex}`
        );

    const content =
        document.getElementById(
            `article-content-${pageIndex}`
        );

    if (!detailRow || !content) {
        return;
    }

    detailRow.style.display = "table-row";
    content.style.display = "block";

    // 본문은 다시 서버에서 가져오도록 함
    content.dataset.loaded = "false";

    loadArticleContent(
        newsId,
        content
    );
}
    // ============================================================
    // 검색 / 구단 필터
    // ============================================================

    function applyFilters(resetPage = true) {

        const teamFilter =
            document.getElementById("team-select").value;

        const keyword =
            document.getElementById("search-input")
                .value
                .trim()
                .toLowerCase();


        let filteredList = allNewsList;


        // 구단 필터
        if (teamFilter !== "ALL") {

            filteredList = filteredList.filter(news =>
                String(news.title || "").includes(teamFilter)
            );
        }


        // 제목 검색
        if (keyword) {

            filteredList = filteredList.filter(news =>
                String(news.title || "")
                    .toLowerCase()
                    .includes(keyword)
            );
        }


        filteredNewsList = filteredList;


        if (resetPage) {
            currentPage = 1;
        }


        const totalPages = Math.max(
            1,
            Math.ceil(
                filteredNewsList.length / ITEMS_PER_PAGE
            )
        );


        if (currentPage > totalPages) {
            currentPage = totalPages;
        }


        renderCurrentPage();
    }


    // ============================================================
    // 현재 페이지 렌더링
    // ============================================================

    function renderCurrentPage() {

        const tbody =
            document.getElementById("news-tbody");


        if (filteredNewsList.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="loading-message">
                        조건에 맞는 검색 결과가 없습니다.
                    </td>
                </tr>
            `;

            renderPagination();

            return;
        }


        const startIndex =
            (currentPage - 1) * ITEMS_PER_PAGE;


        const pageList =
            filteredNewsList.slice(
                startIndex,
                startIndex + ITEMS_PER_PAGE
            );


        renderNewsBoard(
            pageList,
            tbody,
            startIndex
        );


        renderPagination();
    }


    // ============================================================
    // 페이지네이션
    // ============================================================

    function renderPagination() {

        const pagination =
            document.getElementById("pagination");


        const totalPages =
            Math.ceil(
                filteredNewsList.length /
                ITEMS_PER_PAGE
            );


        pagination.innerHTML = "";


        if (totalPages <= 1) {
            return;
        }


        // 이전
        const prevButton =
            document.createElement("button");

        prevButton.textContent = "‹";
        prevButton.title = "이전 페이지";

        prevButton.disabled =
            currentPage === 1;

        prevButton.onclick =
            () => goToPage(currentPage - 1);

        pagination.appendChild(prevButton);


        // 페이지 번호
        let startPage =
            Math.max(1, currentPage - 2);

        let endPage =
            Math.min(totalPages, currentPage + 2);


        if (currentPage <= 3) {
            endPage =
                Math.min(totalPages, 5);
        }


        if (currentPage >= totalPages - 2) {
            startPage =
                Math.max(1, totalPages - 4);
        }


        for (
            let page = startPage;
            page <= endPage;
            page++
        ) {

            const button =
                document.createElement("button");

            button.textContent = page;


            if (page === currentPage) {
                button.classList.add("active");
            }


            button.onclick =
                () => goToPage(page);


            pagination.appendChild(button);
        }


        // 다음
        const nextButton =
            document.createElement("button");

        nextButton.textContent = "›";
        nextButton.title = "다음 페이지";

        nextButton.disabled =
            currentPage === totalPages;

        nextButton.onclick =
            () => goToPage(currentPage + 1);

        pagination.appendChild(nextButton);


        // 페이지 정보
        const info =
            document.createElement("span");

        info.className = "page-info";

        info.textContent =
            `${currentPage} / ${totalPages} 페이지 · 총 ${filteredNewsList.length}개`;

        pagination.appendChild(info);
    }


    // ============================================================
    // 페이지 이동
    // ============================================================

    function goToPage(page) {

        const totalPages =
            Math.ceil(
                filteredNewsList.length /
                ITEMS_PER_PAGE
            );


        if (
            page < 1 ||
            page > totalPages
        ) {
            return;
        }


        currentPage = page;

        renderCurrentPage();


        document
            .querySelector(".table-wrap")
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
    }


    // ============================================================
    // 검색 엔터
    // ============================================================

    function handleSearch(event) {

        if (event.key === "Enter") {
            applyFilters();
        }
    }


    // ============================================================
    // 뉴스 게시판 출력
    // ============================================================

    function renderNewsBoard(
        list,
        tbody,
        startIndex = 0
    ) {

        tbody.innerHTML = "";


        list.forEach((news, index) => {

            const row =
                document.createElement("tr");


            const globalIndex =
                startIndex + index;


            // 실제 최신 기사만 NEW
            const isNew =
                isLatestNews(
                    news,
                    allNewsList
                );


            if (isNew) {
                row.classList.add("new-row");
            }


            // ====================================================
            // 일반 뉴스 행
            // ====================================================

            row.innerHTML = `

                <td>
                    ${news.number || globalIndex + 1}
                </td>


                <td class="col-title">

                    <!--
                        제목 클릭 시 원문 이동이 아니라
                        기사 본문을 바로 펼침
                    -->
                    <a
                        href="javascript:void(0)"
                        class="title-link"
                        onclick="toggleArticle(${news.id}, this, ${index})"
                    >
                        ${escapeHtml(news.title)}
                    </a>


                    ${
                        isNew
                            ? '<span class="new-badge">NEW</span>'
                            : ''
                    }

                </td>


                <td>

                    <div class="action-buttons">

                        <!-- 기존 본문 버튼을 원문사이트 접속으로 변경 -->
                        <button
                            class="btn-body"
                            onclick="openOriginalArticle('${escapeHtml(news.url)}')"
                        >
                            원문사이트 접속
                        </button>


                        <button
                            class="btn-ai"
                            onclick="toggleSummary(${news.id}, this, ${index})"
                        >
                            ✨ 3줄 요약
                        </button>

                    </div>

                </td>


                <td class="col-date">
                    ${escapeHtml(formatDate(news.date))}
                </td>
            `;


            tbody.appendChild(row);


            // ====================================================
            // 기사 상세 행
            // ====================================================

            const detailRow =
                document.createElement("tr");


            detailRow.className =
                "detail-row";


            detailRow.id =
                `detail-row-${index}`;


            detailRow.innerHTML = `

                <td colspan="4">

                    <div class="detail-box">

                        <div class="detail-title">
                            ${escapeHtml(news.title)}
                        </div>


                        <div class="detail-meta">
                            ${escapeHtml(news.author || "MLB Korea")}
                            ·
                            ${escapeHtml(formatDate(news.date))}
                        </div>


                        <!-- 기사 본문 -->
                        <div
                            class="article-content"
                            id="article-content-${index}"
                            style="display:none"
                        ></div>


                        <!-- AI 요약 -->
                        <div
                            class="summary-box"
                            id="summary-box-${index}"
                            style="display:none"
                        >

                            <div class="summary-header">
                                ✨ AI 기사 3줄 요약
                            </div>


                            <div
                                class="summary-text"
                                id="summary-text-${index}"
                            ></div>

                        </div>

                    </div>

                </td>
            `;


            tbody.appendChild(detailRow);

        });


        if (allNewsList.length > 0) {
            firstLoad = false;
        }
    }

// ============================================================
// 기사 본문 가져오기
// ============================================================

async function loadArticleContent(id, content) {

    content.textContent =
        "기사 본문을 불러오는 중...";

    try {

        const response =
            await fetch(
                `${API_BASE}/api/news/mlb/${id}`,
                {
                    cache: "no-store"
                }
            );

        const result =
            await response.json();

        if (
            !response.ok ||
            result.status !== "success"
        ) {
            throw new Error(
                result.detail ||
                "기사 본문 조회 실패"
            );
        }

        content.textContent =
            result.data.content ||
            "기사 본문을 가져오지 못했습니다.";

        content.dataset.loaded = "true";

    } catch (error) {

        console.error(error);

        content.textContent =
            "기사 본문을 불러오지 못했습니다.";
    }
}
    // ============================================================
    // 기사 본문 열기
    // ============================================================

    async function toggleArticle(
    id,
    titleElement,
    index
) {

    const row =
        document.getElementById(
            `detail-row-${index}`
        );

    const content =
        document.getElementById(
            `article-content-${index}`
        );

    const summaryBox =
        document.getElementById(
            `summary-box-${index}`
        );


    // 이미 열려 있으면 닫기
    if (content.style.display === "block") {

        content.style.display = "none";
        summaryBox.style.display = "none";
        row.style.display = "none";

        openedArticleId = null;

        return;
    }


    // 현재 열려 있는 기사 기억
    openedArticleId = id;


    // 본문 열기
    row.style.display = "table-row";
    content.style.display = "block";


    // 이미 불러온 본문이면 다시 요청하지 않음
    if (
        content.dataset.loaded === "true"
    ) {
        return;
    }


    await loadArticleContent(
        id,
        content
    );
}


    // ============================================================
    // 원문 사이트 접속
    // ============================================================

    function openOriginalArticle(url) {

        if (!url) {

            alert(
                "원문 기사 주소가 없습니다."
            );

            return;
        }


        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );
    }


    // ============================================================
    // AI 3줄 요약
    // ============================================================

    async function toggleSummary(
        id,
        button,
        index
    ) {

        const row =
            document.getElementById(
                `detail-row-${index}`
            );


        const content =
            document.getElementById(
                `article-content-${index}`
            );


        const summaryBox =
            document.getElementById(
                `summary-box-${index}`
            );


        const text =
            document.getElementById(
                `summary-text-${index}`
            );


        // ========================================================
        // 이미 열려 있으면 닫기
        // ========================================================

        if (
            summaryBox.style.display === "block"
        ) {

            summaryBox.style.display = "none";

            content.style.display = "none";

            row.style.display = "none";

            button.textContent =
                "✨ 3줄 요약";

            return;
        }


        // ========================================================
        // 요약 열기
        // ========================================================

        row.style.display =
            "table-row";


        summaryBox.style.display =
            "block";


        // 이미 불러온 요약
        if (
            text.dataset.loaded === "true"
        ) {

            button.textContent =
                "요약 닫기";

            return;
        }


        button.disabled = true;

        button.textContent =
            "요약 중...";


        text.textContent =
            "AI가 실제 기사 본문을 분석하고 있습니다...";


        try {

            const response =
                await fetch(
                    `${API_BASE}/api/news/summary/${id}`,
                    {
                        cache: "no-store"
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                result.status !== "success"
            ) {

                throw new Error(
                    result.detail ||
                    "AI 요약 실패"
                );
            }


            text.textContent =
                result.summary;


            text.dataset.loaded =
                "true";


            button.textContent =
                "요약 닫기";


        } catch (error) {

            console.error(error);


            text.textContent =
                `AI 요약 실패: ${error.message}`;


            button.textContent =
                "✨ 3줄 요약";


        } finally {

            button.disabled = false;
        }
    }


    // ============================================================
    // NEW 판정
    // 실제 등록일이 가장 최신인 기사만 NEW
    // ============================================================

    function parseNewsDate(value) {

        if (!value) {
            return null;
        }


        const raw =
            String(value).trim();


        if (!raw) {
            return null;
        }


        let date =
            new Date(raw);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            date =
                new Date(
                    raw.replace(
                        " ",
                        "T"
                    )
                );
        }


        return Number.isNaN(
            date.getTime()
        )
            ? null
            : date;
    }


    function getNewsDate(news) {

        return (
            news?.date ??
            news?.published_at ??
            news?.publishedAt ??
            news?.created_at ??
            news?.createdAt ??
            null
        );
    }


    function isLatestNews(
        news,
        newsList
    ) {

        if (
            !news ||
            !Array.isArray(newsList) ||
            newsList.length === 0
        ) {
            return false;
        }


        const articleDate =
            parseNewsDate(
                getNewsDate(news)
            );


        if (!articleDate) {
            return false;
        }


        const latestTime =
            newsList

                .map(item =>
                    parseNewsDate(
                        getNewsDate(item)
                    )
                )

                .filter(
                    date => date !== null
                )

                .reduce(
                    (
                        max,
                        date
                    ) =>
                        Math.max(
                            max,
                            date.getTime()
                        ),
                    -Infinity
                );


        if (
            latestTime === -Infinity
        ) {
            return false;
        }


        return (
            articleDate.getTime() ===
            latestTime
        );
    }


    // ============================================================
    // 날짜 표시
    // ============================================================

    function formatDate(value) {

        if (!value) {
            return "최근";
        }


        const date =
            new Date(
                value.replace(
                    " ",
                    "T"
                )
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return value;
        }


        return date.toLocaleString(
            "ko-KR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }


    // ============================================================
    // HTML escape
    // ============================================================

    function escapeHtml(value) {

        return String(
            value ?? ""
        )

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );
    }
