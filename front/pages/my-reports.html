<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>신고 내역 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/mypage.css">

    <!-- 기존 마이페이지 목록 스타일 재사용 -->
    <link rel="stylesheet" href="/css/my-posts.css">

    <!-- 새로운 신고 CSS 스타일 적용 -->
    <link rel="stylesheet" href="/css/my-reports.css">
</head>

<body data-page="my-reports">

    <!-- 공통 헤더 -->
    <div id="header"></div>

    <main class="auth-main">
        <div class="auth-layout">

            <!-- 마이페이지 사이드바 -->
            <div id="mypage-sidebar"></div>

            <!-- 본문 -->
            <section class="mypage-content">

                <!-- 페이지 제목 -->
                <div class="mypage-title">
                    <h1>신고 내역</h1>
                    <p>
                        커뮤니티에서 신고한 게시글과 신고 처리 상태를 확인할 수 있습니다.
                    </p>
                </div>

                <!-- 신고 내역 목록 -->
                <div class="mypage-box">

                    <div class="mypage-box-title">
                        신고 목록
                        <span class="my-reports-total">총 0개</span>
                    </div>

                    <div class="mypage-box-body">

                        <!-- JavaScript가 신고 내역을 표시하는 영역 -->
                        <ul class="activity-list my-reports-list"></ul>

                        <!-- 신고 내역이 없거나 조회할 수 없을 때 표시 -->
                        <p id="my-reports-empty" style="display: none;">
                            신고 내역이 없습니다.
                        </p>

                    </div>
                </div>

            </section>
        </div>
    </main>

    <!-- 공통 푸터 -->
    <div id="footer"></div>

    <!-- 공통 JavaScript -->
    <script src="/js/main.js"></script>
    <script src="/js/mypage.js"></script>

    <!-- 신고 내역 JavaScript -->
    <script src="/js/my-reports.js"></script>

</body>
</html>
