
<!-- BASEBOT 공통 AI 챗봇 -->

<div class="chatbot" id="basebot-chatbot">

    <!-- 챗봇 버튼 -->
    <button
        type="button"
        class="chatbot-button"
        id="chatbotButton"
        aria-label="BASEBOT AI 챗봇 열기"
        aria-expanded="false"
    >
        <span class="chatbot-icon">
            AI
        </span>

        <span class="chatbot-button-text">
            BASEBOT AI
        </span>
    </button>

    <!-- 챗봇 창 -->
    <div
        class="chatbot-window"
        id="chatbotWindow"
        aria-label="BASEBOT AI 대화창"
    >

        <!-- 챗봇 헤더 -->
        <div class="chatbot-header">

            <div class="chatbot-title">

                <div class="chatbot-title-icon">
                    AI
                </div>

                <div>
                    <strong>
                        BASEBOT AI
                    </strong>

                    <span>
                        야구 AI 챗봇
                    </span>
                </div>

            </div>

            <button
                type="button"
                class="chatbot-close"
                id="chatbotClose"
                aria-label="챗봇 닫기"
            >
                ×
            </button>

        </div>

        <!-- 챗봇 메시지 영역 -->
        <div class="chatbot-body" id="chatbotBody">

            <div class="chatbot-message bot">

                <div class="message-icon">
                    AI
                </div>

                <div class="message-content">안녕하세요! 👋<br>BASEBOT AI입니다.<br>야구에 대해 궁금한 내용을 질문해주세요.</div>

            </div>

        </div>

        <!-- 챗봇 입력 영역 -->
        <div class="chatbot-input-area">

            <input
                type="text"
                id="chatbotInput"
                placeholder="야구에 대해 질문해보세요."
                autocomplete="off"
                aria-label="챗봇 질문 입력"
            >

            <button
                type="button"
                id="chatbotSend"
                aria-label="메시지 전송"
            >
                ↑
            </button>

        </div>

    </div>

</div>
