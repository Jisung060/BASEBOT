<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>비밀번호 찾기 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 비밀번호 찾기 CSS -->
    <link rel="stylesheet" href="/css/find-password.css">
</head>

<body>

    <!-- Header -->
    <div id="header"></div>


    <!-- Main -->
    <main class="auth-main">

        <div class="auth-layout">

            <!-- Sidebar -->
            <div id="auth-sidebar"></div>


            <!-- 비밀번호 찾기 -->
            <section class="find-password-content">

                <!-- 페이지 제목 -->
                <div class="find-password-title">

                    <h1>비밀번호 찾기</h1>

                    <p>
                        가입 시 등록한 정보를 입력해주세요.
                    </p>

                </div>


                <!-- =================================
                     회원정보 확인
                ================================== -->
                <div
                    id="password-find-step"
                    class="password-find-box"
                >

                    <h2>비밀번호 찾기</h2>

                    <p class="password-find-notice">
                        아이디와 이메일을 입력하시면
                        비밀번호를 재설정할 수 있습니다.
                    </p>


                    <div class="password-find-form">

                        <!-- 아이디 -->
                        <div class="password-find-row">

                            <label for="username">
                                아이디
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="아이디를 입력해주세요."
                            >

                        </div>


                        <!-- 이메일 -->
                        <div class="password-find-row">

                            <label for="email">
                                이메일
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="가입 시 등록한 이메일을 입력해주세요."
                            >

                        </div>


                        <!-- 확인 버튼 -->
                        <button
                            type="button"
                            id="verifyButton"
                            class="password-find-button"
                        >
                            비밀번호 찾기
                        </button>

                    </div>

                </div>


                <!-- =================================
                     새 비밀번호 설정
                ================================== -->
                <div
                    id="password-reset-step"
                    class="password-reset-box"
                >

                    <h2>새 비밀번호 설정</h2>

                    <p class="password-find-notice">
                        새로운 비밀번호를 입력해주세요.
                    </p>


                    <div class="password-find-form">

                        <!-- 새 비밀번호 -->
                        <div class="password-find-row">

                            <label for="newPassword">
                                새 비밀번호
                            </label>

                            <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                placeholder="새 비밀번호를 입력해주세요."
                            >

                        </div>


                        <!-- 비밀번호 확인 -->
                        <div class="password-find-row">

                            <label for="newPasswordConfirm">
                                비밀번호 확인
                            </label>

                            <input
                                type="password"
                                id="newPasswordConfirm"
                                name="newPasswordConfirm"
                                placeholder="새 비밀번호를 다시 입력해주세요."
                            >

                        </div>


                        <!-- 변경 버튼 -->
                        <button
                            type="button"
                            id="resetPasswordButton"
                            class="password-find-button"
                        >
                            비밀번호 변경
                        </button>

                    </div>

                </div>


                <!-- =================================
                     완료
                ================================== -->
                <div
                    id="password-complete-step"
                    class="password-complete-box"
                >

                    <div class="password-complete-icon">
                        ✓
                    </div>

                    <h2>
                        비밀번호가 변경되었습니다.
                    </h2>

                    <p>
                        새로운 비밀번호로 로그인해주세요.
                    </p>

                    <a
                        href="login.html"
                        class="password-login-button"
                    >
                        로그인
                    </a>

                </div>

            </section>

        </div>

    </main>


    <!-- Footer -->
    <div id="footer"></div>


    <!-- 공통 JS -->
    <script src="/js/main.js"></script>

    <!-- 비밀번호 찾기 JS -->
    <script src="/js/find-password.js"></script>

</body>
</html>
