<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 | BASEBOT</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/notice-view.css">
</head>
<body>
<div id="header"></div>

<main class="notice-view-main">

    <!-- 공지 머리 부분: 분류, 제목, 날짜, 조회 수 -->
    <div class="notice-view-head">
        <div class="notice-view-badges">
            <em class="notice-view-pin" id="notice-pin" hidden>고정</em>
            <em class="notice-view-badge" id="notice-category"></em>
        </div>

        <h1 class="notice-view-title" id="notice-title">공지사항을 불러오는 중입니다...</h1>

        <div class="notice-view-meta">
            <span id="notice-writer"></span>
            <span id="notice-date"></span>
            <span id="notice-views"></span>
        </div>
    </div>

    <!-- 공지 본문 -->
    <div class="notice-view-content" id="notice-content"></div>

    <!-- 버튼: 목록은 모두에게, 수정/삭제는 관리자에게만 보임 -->
    <div class="notice-view-actions">
        <a href="/notice.html" class="notice-btn">목록</a>

        <div class="notice-admin-actions" id="notice-admin-actions" hidden>
            <button type="button" class="notice-btn" id="notice-edit-btn">수정</button>
            <button type="button" class="notice-btn danger" id="notice-delete-btn">삭제</button>
        </div>
    </div>

</main>

<div id="footer"></div>
<script src="../js/main.js"></script>
<script src="../js/notice-view.js"></script>
</body>
</html>
