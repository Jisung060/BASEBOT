<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 활동 이력 | BASEBOT ADMIN</title>
    <link rel="stylesheet" href="../../css/admin/admin.css">
</head>
<body class="admin-page" data-page="activity-logs">
    <div class="admin-layout">
        <aside
            class="admin-sidebar"
            id="admin-sidebar-container"
        ></aside>

        <main class="admin-main">
            <header
                class="admin-topbar"
                id="admin-topbar-container"
            ></header>
            <div class="admin-content">

<section class="page-intro"><p>관리자 계정에서 수행한 주요 작업과 처리 결과를 확인합니다.</p></section>
<section class="panel">
    <div class="panel-heading"><div><h2>활동 이력 검색</h2><p>관리자, 작업 유형 및 기간별로 조회합니다.</p></div></div>
    <form class="filter-form" action="#" method="get">
        <label>관리자 계정<input type="search" name="admin" placeholder="관리자 아이디"></label>
        <label>작업 유형<select name="action"><option value="">전체 작업</option><option>회원 관리</option><option>게시글 관리</option><option>신고 처리</option><option>공지사항 관리</option><option>시스템 설정</option></select></label>
        <label>시작일<input type="date" name="start_date"></label>
        <label>종료일<input type="date" name="end_date"></label>
        <button class="button button-primary" type="submit">조회</button>
    </form>
</section>
<section class="panel">
    <div class="panel-heading"><div><h2>작업 이력</h2><p>관리자 작업 로그 테이블/API 연동 영역</p></div><span class="count-label">총 —건</span></div>
    <div class="table-wrap"><table><thead><tr><th>일시</th><th>관리자</th><th>작업 유형</th><th>대상</th><th>처리 내용</th><th>결과</th></tr></thead><tbody><tr><td colspan="6" class="table-empty">기록된 활동 이력이 없습니다.</td></tr></tbody></table></div>
</section>
<div class="notice-box"><strong>기록 원칙</strong><p>작업 이력은 프런트엔드에서 임의로 만들지 말고, 실제 변경을 수행하는 백엔드에서 성공·실패 결과와 함께 기록해야 합니다.</p></div>
            </div>
            <footer
                class="admin-footer"
                id="admin-footer-container"
            ></footer>
        </main>
    </div>
    <script src="/js/admin/admin-common.js"></script>
</body>
</html>
