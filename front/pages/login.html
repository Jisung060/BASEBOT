<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="../css/auth.css">

    <!-- 로그인 페이지 전용 CSS -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Header -->
    <div id="header"></div>


    <!-- Main -->
    <main class="auth-main">

        <div class="auth-layout">

            <!-- Sidebar -->
            <div id="auth-sidebar"></div>


            <!-- Login Content -->
            <section class="login-content">

                <!-- 제목 -->
                <div class="login-title">
                    <h1>로그인</h1>
                    <p>BASEBOT 서비스를 이용하시려면 로그인해주세요.</p>
                </div>


                <!-- 로그인 영역 -->
                <div class="login-box">

                    <h2>BASEBOT 홈페이지에 오신걸 환영합니다</h2>

                    <div class="login-form-area">

                        <!-- 로고 -->
                        <div class="login-logo">
                            <a href="main.html">BASEBOT</a>
                        </div>


                        <!-- 구분선 -->
                        <div class="login-divider"></div>


                        <!-- 입력 -->
                        <div class="login-input-area">

                            <div class="login-input-row">
                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    placeholder="아이디"
                                    autocomplete="username"
                                >
                            </div>

                            <div class="login-input-row">
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="비밀번호"
                                    autocomplete="current-password"
                                >
                            </div>

                        </div>


                        <!-- 로그인 버튼 -->
                        <button
                            type="button"
                            class="login-button"
                            id="loginButton"
                        >
                            로그인
                        </button>

                    </div>


                    <!-- 회원가입 안내 -->
                    <div class="login-signup-guide">

                        <p>
                            아직 BASEBOT 홈페이지 회원이 아니신 분은
                            <br>
                            회원가입 후 이용부탁드립니다.
                        </p>

                        <a href="signup.html" class="signup-button">
                            회원가입
                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- Footer -->
    <div id="footer"></div>


    <!-- 공통 JS -->
    <script src="../js/main.js"></script>

    <!-- 로그인 JS -->
    <script src="../js/login.js"></script>

</body>
</html>
