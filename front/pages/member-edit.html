<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원정보 수정 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 마이페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/mypage.css">
</head>

<body data-page="member-edit">

    <!-- Header -->
    <div id="header"></div>

    <!-- Main -->
    <main class="auth-main">

        <div class="auth-layout">

            <!-- Sidebar -->
            <div id="mypage-sidebar"></div>


<section class="mypage-content">
    <!-- 브레드크럼 -->
    <nav class="mypage-breadcrumb" aria-label="현재 위치">
        <a href="/main.html" class="breadcrumb-home">홈</a>

        <span class="breadcrumb-separator">&gt;</span>

        <span class="breadcrumb-current">정보 수정</span>
    </nav>

    <div class="mypage-title">
        <h1>회원정보 수정</h1>
        <p>회원님의 기본 정보와 관심 구단을 수정할 수 있습니다.</p>
    </div>

    <div class="mypage-box">

        <div class="mypage-box-title">
            회원정보
        </div>

        <div class="mypage-box-body">

            <form class="mypage-form" id="memberEditForm">

                <div class="mypage-form-row">
                    <label class="mypage-form-label" for="editUsername">
                        아이디
                    </label>

                    <input
                        type="text"
                        id="editUsername"
                        readonly
                    >
                </div>

                <div class="mypage-form-row">
                    <label class="mypage-form-label" for="editNickname">
                        닉네임
                    </label>

                    <input
                        type="text"
                        id="editNickname"
                        placeholder="닉네임"
                    >
                </div>

                <div class="mypage-form-row">
                    <label class="mypage-form-label" for="editEmail">
                        이메일
                    </label>

                    <input
                        type="email"
                        id="editEmail"
                        placeholder="이메일"
                    >
                </div>

                <div class="mypage-form-row">
                    <label class="mypage-form-label" for="editFavoriteTeam">
                        관심 구단
                    </label>

                    <select id="editFavoriteTeam">
                        <option value="">선택하지 않음</option>
                        <!-- 팀 목록은 member-edit.js에서 DB(API) 데이터를 받아와 동적으로 채워집니다 -->
                    </select>
                </div>

                <div class="mypage-form-actions">
                    <a
                        href="mypage.html"
                        class="mypage-button mypage-button-outline"
                    >
                        취소
                    </a>

                    <button
                        type="submit"
                        class="mypage-button"
                    >
                        저장
                    </button>
                </div>

            </form>

        </div>
    </div>

 <!-- 2. 비밀번호 변경 영역 (기존 클래스 완벽 적용) -->
    <div class="mypage-box">
        <div class="mypage-box-title">
            비밀번호 변경
        </div>
        <div class="mypage-box-body">
            <form class="mypage-form" id="passwordChangeForm">
                <div class="mypage-form-row">
                    <label class="mypage-form-label" for="currentPassword">현재 비밀번호</label>
                    <input type="password" id="currentPassword" placeholder="현재 비밀번호를 입력하세요">
                </div>
                <div class="mypage-form-row">
                    <label class="mypage-form-label" for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" placeholder="새 비밀번호를 입력하세요">
                </div>
                <div class="mypage-form-row">
                    <label class="mypage-form-label" for="confirmPassword">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassword" placeholder="새 비밀번호를 한 번 더 입력하세요">
                </div>
                <div class="mypage-form-actions">
                    <button type="button" id="cancelPasswordBtn" class="mypage-button mypage-button-outline">취소</button>
                    <button type="submit" class="mypage-button">비밀번호 변경</button>
                </div>
            </form>
        </div>
    </div>


        <!-- 회원 탈퇴 -->
    <div class="mypage-box withdrawal-box">

        <div class="mypage-box-title">
            회원 탈퇴
        </div>

        <div class="mypage-box-body">

            <p>
                BASEBOT 회원 탈퇴를 신청할 수 있습니다.
                탈퇴 신청 후에는 관리자 확인 및 탈퇴 처리 절차가 진행됩니다.
            </p>

            <div class="mypage-form-actions">
                <button
                    type="button"
                    id="withdrawalRequestButton"
                    class="mypage-button mypage-button-outline"
                >
                    회원 탈퇴 신청
                </button>
            </div>

        </div>
    </div>
</section>


        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- 공통 JS -->
    <script src="/js/main.js"></script>

    <!-- 마이페이지 공통 JS -->
    <script src="/js/mypage.js"></script>

    <script src="/js/member-edit.js"></script>

</body>
</html>
