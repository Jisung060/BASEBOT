<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내가 쓴 글 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 마이페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/mypage.css">

    <!-- 내가 쓴 글 전용 CSS (스크랩/신고 내역과 동일한 디자인) -->
    <link rel="stylesheet" href="/css/my-posts.css">
</head>

<body data-page="my-posts">

    <!-- Header -->
    <div id="header"></div>

    <!-- Main -->
    <main class="auth-main">
        <div class="auth-layout">

            <!-- Sidebar -->
            <div id="mypage-sidebar"></div>

            <!-- Content -->
            <section class="mypage-content my-posts-page">

                <!-- 페이지 제목 -->
                <div class="mypage-title">
                    <h1>내가 쓴 글</h1>
                    <p>
                        커뮤니티에서 내가 작성한 게시글을 확인하고 관리할 수 있습니다.
                    </p>
                </div>

                <!-- 게시글 목록 카드 -->
                <div class="mypage-box my-posts-box">

                    <!-- 카드 제목 -->
                    <div class="mypage-box-title my-posts-box-header">
                        <div>
                            <span>게시글 목록</span>
                            <p>작성한 게시글을 확인해 보세요.</p>
                        </div>

                        <span class="my-posts-total">총 0개</span>
                    </div>

                    <div class="mypage-box-body my-posts-body">

                        <!-- 카테고리 필터 -->
                        <div class="my-posts-tabs"
                             role="group"
                             aria-label="게시글 카테고리 필터">

                            <button type="button"
                                    class="my-posts-tab active"
                                    data-category="ALL"
                                    aria-pressed="true">
                                전체
                            </button>

                            <button type="button"
                                    class="my-posts-tab"
                                    data-category="NEWS"
                                    aria-pressed="false">
                                야구 뉴스
                            </button>

                            <button type="button"
                                    class="my-posts-tab"
                                    data-category="GAME_THREAD"
                                    aria-pressed="false">
                                경기
                            </button>

                            <button type="button"
                                    class="my-posts-tab"
                                    data-category="ANALYSIS"
                                    aria-pressed="false">
                                분석
                            </button>

                            <button type="button"
                                    class="my-posts-tab"
                                    data-category="GENERAL"
                                    aria-pressed="false">
                                자유글
                            </button>
                        </div>

                        <!-- 검색 / 정렬 -->
                        <div class="my-posts-toolbar">

                            <label class="my-posts-search">
                                <span class="sr-only">게시글 제목 검색</span>

                                <span class="my-posts-search-icon"
                                      aria-hidden="true">⌕</span>

                                <input type="search"
                                       id="myPostsSearchInput"
                                       placeholder="내가 쓴 게시글 제목 검색..."
                                       autocomplete="off">
                            </label>

                            <label class="my-posts-sort">
                                <span class="sr-only">게시글 정렬</span>

                                <select id="myPostsSort">
                                    <option value="newest">최신 작성순</option>
                                    <option value="oldest">오래된 작성순</option>
                                    <option value="views">조회 많은 순</option>
                                    <option value="likes">추천 많은 순</option>
                                </select>
                            </label>

                        </div>

                        <!-- 목록 건수 -->
                        <div class="my-posts-list-heading">
                            <span id="myPostsResultCount">게시글 0개</span>
                        </div>

                        <!-- JavaScript가 게시글을 표시하는 영역 -->
                        <ul class="activity-list my-posts-list my-posts-items">
                        </ul>

                        <!-- 목록이 없을 때 -->
                        <div id="my-posts-empty"
                             class="my-posts-empty"
                             style="display: none;">

                            <div class="my-posts-empty-icon"
                                 aria-hidden="true">✎</div>

                            <strong>작성한 게시글이 없습니다.</strong>

                            <p>
                                커뮤니티에 첫 글을 작성해 보세요.
                            </p>
                        </div>

                        <!-- 페이지 이동 -->
                        <nav id="my-posts-pagination"
                             class="my-posts-pagination my-posts-pager"
                             aria-label="내가 쓴 글 페이지 이동">
                        </nav>

                    </div>
                </div>

            </section>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- 공통 JS -->
    <script src="/js/main.js"></script>

    <!-- 마이페이지 공통 JS -->
    <script src="/js/mypage.js"></script>

    <!-- 내가 쓴 글 JS -->
    <script src="/js/my-posts.js"></script>

</body>
</html>
