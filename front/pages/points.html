<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>포인트 / 등급 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 마이페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/mypage.css">
</head>

<body data-page="points">

    <!-- Header -->
    <div id="header"></div>

    <!-- Main -->
    <main class="auth-main">

        <div class="auth-layout">

            <!-- Sidebar -->
            <div id="mypage-sidebar"></div>


<section class="mypage-content">

    <div class="mypage-title">
        <h1>포인트 / 등급</h1>
        <p>경기 예측 활동을 통해 획득한 포인트와 등급을 확인할 수 있습니다.</p>
    </div>

    <div class="mypage-stat-grid">

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">현재 포인트</div>
            <div class="mypage-stat-value">1,000 P</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">현재 등급</div>
            <div class="mypage-stat-value">BRONZE</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">현재 연속 적중</div>
            <div class="mypage-stat-value">0회</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">최고 연속 적중</div>
            <div class="mypage-stat-value">0회</div>
        </div>

    </div>

    <div class="mypage-box">

        <div class="mypage-box-title">
            등급 현황
        </div>

        <div class="mypage-box-body">

            <div>
                <span class="grade-badge">BRONZE</span>
            </div>

            <div class="grade-progress">

                <div class="grade-progress-head">
                    <span>BRONZE</span>
                    <span>다음 등급까지 1,000 P</span>
                </div>

                <div class="grade-progress-bar">
                    <div class="grade-progress-value"></div>
                </div>

            </div>

        </div>
    </div>

    <div class="mypage-box">

        <div class="mypage-box-title">
            포인트 내역
        </div>

        <div class="mypage-box-body">

            <div class="mypage-empty">
                포인트 내역이 없습니다.
            </div>

        </div>
    </div>

</section>


        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- 공통 JS -->
    <script src="/js/main.js"></script>

    <!-- 마이페이지 공통 JS -->
    <script src="/js/mypage.js"></script>



</body>
</html>
