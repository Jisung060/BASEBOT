<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내가 쓴 댓글 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 마이페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/mypage.css">
</head>

<body data-page="my-comments">
    <!-- Header -->
    <div id="header"></div>
    <!-- Main -->
    <main class="auth-main">
        <div class="auth-layout">
            <!-- Sidebar -->
            <div id="mypage-sidebar"></div>

<section class="mypage-content">
    <div class="mypage-title">
        <h1>내가 쓴 댓글</h1>
        <p>커뮤니티에서 내가 작성한 댓글을 확인할 수 있습니다.</p>
    </div>
    <div class="mypage-box">

        <div class="mypage-box-title">
            댓글 활동
        </div>

        <div class="mypage-box-body">

            <!-- 활동 요약 -->
            <div class="my-comments-summary">

                <div class="summary-card">
                    <div class="summary-icon">✎</div>
                    <div class="summary-info">
                        <span class="summary-label">내가 작성한 댓글</span>
                        <div class="summary-value">
                            <strong id="total-comments">0</strong>
                            <span>개</span>
                        </div>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-icon">♥</div>
                    <div class="summary-info">
                        <span class="summary-label">내 댓글이 받은 좋아요</span>
                        <div class="summary-value">
                            <strong id="total-comment-likes">0</strong>
                            <span>개</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 목록 제목 -->
            <div class="my-comments-list-header">
                <div>
                    <h2>내가 작성한 댓글</h2>
                    <p>댓글을 선택하면 해당 게시글로 이동합니다.</p>
                </div>
                <span class="my-comments-count">
                    총 <strong id="comments-count-label">0</strong>개
                </span>
            </div>

            <!-- 댓글 목록 -->
            <ul class="activity-list" id="my-comments-list">
                <li class="empty-comment">
                    댓글을 불러오는 중입니다.
                </li>
            </ul>

            <!-- 페이지네이션 -->
            <div
                id="my-comments-pagination"
                class="mypage-pagination">
            </div>

        </div>
    </div>

</section>


        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- 공통 JS -->
    <script src="/js/main.js"></script>

    <!-- 마이페이지 공통 JS -->
    <script src="/js/mypage.js"></script>

    <!-- 내가 쓴 댓글 -->
    <script src="/js/my-comments.js"></script>

</body>
</html>
