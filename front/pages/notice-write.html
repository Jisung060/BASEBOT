<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 작성 | BASEBOT</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/common-page.css">
    <link rel="stylesheet" href="../css/community.css">
    <style>
        /* 공지 내용 입력칸 (커뮤니티 입력칸과 같은 테두리) */
        .notice-content-input {
            min-height: 400px;
            padding: 14px;
            border: 1px solid #d8dde6;
            font: inherit;
            font-size: 15px;
            line-height: 1.8;
            resize: vertical;
        }

        /* 제목·너비·여백: 일정·결과, 순위, 경기 상세와 같게 (이 페이지에만 적용) */
        .notice-page {
            padding-top: 18px;
        }

        .notice-page .community-layout.no-sidebar {
            width: min(1100px, calc(100% - 40px));
        }

        .notice-page .community-title h1 {
            color: #152b52;
        }

        .notice-page .community-title p {
            color: #727d8e;
        }
    </style>
</head>
<body>
<div id="header"></div>

<!-- 커뮤니티 글쓰기(community-write.html)와 같은 구조 -->
<main class="community-main notice-page">
    <div class="community-layout no-sidebar">

        <section class="community-content">
            <div class="community-title">
                <h1 id="writePageTitle">공지사항 작성</h1>
                <p>사용자 화면에 노출되는 공지사항을 등록합니다.</p>
            </div>

            <form class="write-form" id="noticeWriteForm">
                <div class="write-table">

                    <div class="write-row">
                        <div class="write-label">분류<span>*</span></div>
                        <div class="write-input-area">
                            <select name="category" required>
                                <option value="">분류를 선택하세요</option>
                                <option value="NOTICE">일반공지</option>
                                <option value="IMPORTANT">중요공지</option>
                                <option value="MAINTENANCE">점검</option>
                            </select>
                        </div>
                    </div>

                    <div class="write-row">
                        <div class="write-label">상단 고정</div>
                        <div class="write-input-area">
                            <select name="is_pinned">
                                <option value="0">고정 안 함</option>
                                <option value="1">상단 고정</option>
                            </select>
                            <p class="input-guide">
                                이용수칙·점검 일정처럼 항상 맨 위에 보여야 하는 공지는 '상단 고정'을 선택하세요.
                            </p>
                        </div>
                    </div>

                    <div class="write-row">
                        <div class="write-label">제목<span>*</span></div>
                        <div class="write-input-area">
                            <input type="text" name="title" maxlength="200"
                                   placeholder="제목을 입력하세요 (최대 200자)" required>
                        </div>
                    </div>

                    <div class="write-row content-row">
                        <div class="write-label">내용<span>*</span></div>
                        <div class="write-input-area">
                            <textarea name="content" class="notice-content-input"
                                      placeholder="공지사항 내용을 입력하세요." required></textarea>
                            <p class="input-guide">
                                입력한 줄바꿈이 그대로 공지에 표시됩니다.
                            </p>
                        </div>
                    </div>

                </div>

                <div class="write-button-area">
                    <a href="notice.html" class="community-btn" id="cancelWriteButton">취소</a>
                    <button type="submit" class="community-btn primary" id="submitWriteButton">작성완료</button>
                </div>
            </form>
        </section>
    </div>
</main>

<div id="footer"></div>

<!-- BASEBOT 공통 팝업 -->
<div id="basebotModal" class="basebot-modal">
    <div class="basebot-modal-box">
        <h3 id="basebotModalTitle"></h3>
        <p id="basebotModalMessage"></p>
        <div class="basebot-modal-button-area">
            <button type="button" id="basebotModalButton" class="community-btn primary">확인</button>
        </div>
    </div>
</div>

<script src="../js/main.js"></script>
<script>
    /* =========================================
       공지사항 작성 / 수정
       - 주소에 ?id=3 이 있으면 수정, 없으면 새 글 작성
       - 관리자만 사용 가능 (서버에서도 다시 확인함)
    ========================================= */

    const form = document.getElementById("noticeWriteForm");
    const editId = new URLSearchParams(location.search).get("id");   // 수정할 공지 번호 (없으면 null)

    // 알림 팝업 (커뮤니티 공통 팝업과 같은 모양)
    function showBasebotModal(title, message, callback = null) {
        const modal = document.getElementById("basebotModal");
        document.getElementById("basebotModalTitle").textContent = title;
        document.getElementById("basebotModalMessage").textContent = message;
        modal.classList.add("show");
        document.getElementById("basebotModalButton").onclick = () => {
            modal.classList.remove("show");
            if (callback) callback();
        };
    }

    // 로그인한 사용자가 관리자인지 확인
    function isAdminUser() {
        try {
            const user = JSON.parse(sessionStorage.getItem("user"));
            return Boolean(sessionStorage.getItem("access_token")) && user?.role === "ADMIN";
        } catch (error) {
            return false;
        }
    }

    // 수정 모드: 기존 공지 내용을 입력칸에 채움 (조회 수는 올리지 않음)
    async function loadNoticeForEdit() {
        document.getElementById("writePageTitle").textContent = "공지사항 수정";
        document.getElementById("submitWriteButton").textContent = "수정완료";
        document.getElementById("cancelWriteButton").href = `notice-view.html?id=${encodeURIComponent(editId)}`;

        const response = await fetch(`/api/notices/${encodeURIComponent(editId)}?increase_view=false`);
        if (!response.ok) {
            showBasebotModal("오류", "수정할 공지사항을 찾을 수 없습니다.", () => location.href = "/notice.html");
            return;
        }
        const notice = await response.json();
        form.category.value = notice.category;
        form.is_pinned.value = notice.is_pinned ? "1" : "0";
        form.title.value = notice.title;
        form.content.value = notice.content;
    }

    // 작성완료 / 수정완료
    form.addEventListener("submit", async event => {
        event.preventDefault();   // 페이지 새로고침 막기

        const data = {
            category: form.category.value,
            is_pinned: form.is_pinned.value === "1",
            title: form.title.value.trim(),
            content: form.content.value
        };

        if (!data.title || !data.content.trim()) {
            showBasebotModal("입력 확인", "제목과 내용을 입력해 주세요.");
            return;
        }

        try {
            const response = await fetch(editId ? `/api/notices/${encodeURIComponent(editId)}` : "/api/notices", {
                method: editId ? "PUT" : "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${sessionStorage.getItem("access_token")}`
                },
                body: JSON.stringify(data)
            });

            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(typeof result.detail === "string" ? result.detail : "저장에 실패했습니다.");
            }

            showBasebotModal(
                editId ? "수정 완료" : "등록 완료",
                result.message,
                () => location.href = `/notice-view.html?id=${encodeURIComponent(result.notice_id)}`
            );
        } catch (error) {
            console.error("공지사항 저장 오류:", error);
            showBasebotModal("저장 오류", error.message);
        }
    });

    // 시작: 관리자가 아니면 목록으로 돌려보냄
    document.addEventListener("DOMContentLoaded", () => {
        if (!isAdminUser()) {
            showBasebotModal("접근 불가", "공지사항 작성은 관리자만 이용할 수 있습니다.", () => location.href = "/notice.html");
            return;
        }
        if (editId) loadNoticeForEdit();
    });
</script>
</body>
</html>
