<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 | BASEBOT</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/common-page.css">
    <link rel="stylesheet" href="../css/community.css">
</head>
<body>
<div id="header"></div>

<main class="community-main">
    <div class="community-layout no-sidebar">

        <section class="community-content">
            <div class="community-title">
                <h1>게시글</h1>
                <p>게시글을 읽고 댓글로 의견을 자유롭게 나눠보세요.</p>
            </div>

            <article class="post-detail">
                <div class="post-head">
                    <span class="category-label" id="postCategory"></span>
                    <h2 id="postTitle"></h2>
                </div>

                <div class="post-meta">
                    <span>작성자 <strong id="postAuthor"></strong></span>
                    <span>작성일 <strong id="postDate"></strong></span>
                    <span>관련 구단 <strong id="postTeam"></strong></span>
                    <span>조회 <strong id="postViewCount"></strong></span>
                </div>

                <div class="post-body" id="postBody"></div>


                <div class="post-action-area">
                    <button type="button" class="post-action like" id="postLikeButton">
                        ♥ 좋아요 <strong>0</strong>
                    </button>

                    <button type="button" class="post-action" id="postScrapButton">
                        🔖 스크랩
                    </button>

                    <button type="button" class="post-action" id="postShareButton">
                        🔗 공유하기
                    </button>

                    <button type="button" class="post-action report" id="postReportButton">
                        ⚠ 신고
                    </button>
                </div>

                <div class="post-owner-area" style="display: none;">
                    <a href="#"
                       class="community-btn small"
                       id="editPostButton">
                        수정
                    </a>

                    <button
                        type="button"
                        class="community-btn small"
                        id="deletePostButton">
                        삭제
                    </button>
                </div>
                </article>


            <section class="comment-section">
                <div class="comment-section-title">댓글 <span id="commentCount">0</span></div>

                <form class="comment-write" id="commentForm">
                    <textarea name="content" placeholder="댓글을 입력하세요" aria-label="댓글 입력"></textarea>
                    <button type="submit">댓글 등록</button>
                </form>

                <div id="commentList"></div>

            </section>

            <div class="post-bottom-area">
                <a href="community.html" class="community-btn">목록</a>
            </div>
        </section>
    </div>
</main>

<!-- ==============================
     공유 팝업
============================== -->

<div id="shareModal" class="modal-backdrop" hidden>

    <div class="share-modal">

        <!-- 팝업 상단 -->
        <div class="share-modal-header">

            <div>
                <span class="share-modal-label">
                    BASEBOT
                </span>

                <h3>
                    공유하기
                </h3>
            </div>

            <button
                type="button"
                id="closeShareModal"
                class="share-modal-close"
                aria-label="공유 창 닫기"
            >
                ×
            </button>

        </div>


        <!-- 설명 -->
        <div class="share-modal-description">

            <p>
                이 게시글을 다른 사람과 공유해보세요.
            </p>

        </div>


        <!-- 공유 방법 -->
        <div class="share-options">

            <!-- 링크 복사 -->
            <button
                type="button"
                class="share-option"
                id="copyLinkButton"
            >

                <span class="share-icon copy">
                    🔗
                </span>

                <span class="share-option-text">
                    <strong>
                        링크 복사
                    </strong>

                    <small>
                        게시글 주소를 클립보드에 복사합니다.
                    </small>
                </span>

                <span class="share-option-arrow">
                    →
                </span>

            </button>


            <!-- 기기 공유 -->
            <button
                type="button"
                class="share-option"
                id="nativeShareButton"
            >

                <span class="share-icon device">
                    📤
                </span>

                <span class="share-option-text">
                    <strong>
                        기기 공유
                    </strong>

                    <small>
                        카카오톡 등 설치된 공유 앱을 이용합니다.
                    </small>
                </span>

                <span class="share-option-arrow">
                    →
                </span>

            </button>

        </div>


        <!-- 안내 -->
        <div class="share-modal-notice">

            <span>ⓘ</span>

            <p>
                카카오톡 전용 공유 기능은
                추후 카카오 개발자 앱 연동 후 추가할 수 있습니다.
            </p>

        </div>

    </div>

</div>

<div id="reportModal" class="modal-backdrop" hidden>
    <div class="report-modal">
        <div class="modal-head">
            <h3>게시글 신고</h3>
            <button type="button" class="modal-close" id="closeReportModal">×</button>
        </div>
        <div class="report-body">
            <label><input type="radio" name="reportReason" value="ABUSE"> 욕설 / 비방</label>
            <label><input type="radio" name="reportReason" value="AD"> 광고 / 홍보</label>
            <label><input type="radio" name="reportReason" value="SPAM"> 도배</label>
            <label><input type="radio" name="reportReason" value="INAPPROPRIATE"> 부적절한 내용</label>
            <label><input type="radio" name="reportReason" value="ETC"> 기타</label>
            <textarea id="reportContent" placeholder="신고 내용을 입력해주세요."></textarea>
        </div>
        <div class="modal-actions">
            <button type="button" class="community-btn" id="cancelReport">취소</button>
            <button type="button" class="community-btn primary" id="submitReport">신고하기</button>
        </div>
    </div>
</div>

<!-- BASEBOT 공통 팝업 -->
<div id="basebotModal" class="basebot-modal">

    <div class="basebot-modal-box">

        <h3 id="basebotModalTitle"></h3>

        <p id="basebotModalMessage"></p>

        <div class="basebot-modal-button-area">

            <button
                type="button"
                id="basebotModalCancelButton"
                class="community-btn"
                style="display: none;"
            >
                취소
            </button>

            <button
                type="button"
                id="basebotModalButton"
                class="community-btn primary"
            >
                확인
            </button>

        </div>

    </div>

</div>

<div id="footer"></div>
<script src="../js/main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.17/purify.min.js"></script>
<script src="../js/community.js"></script>
</body>
</html>
