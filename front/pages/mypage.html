<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>마이페이지 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 마이페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/mypage.css">
</head>

<body data-page="mypage">

    <!-- Header -->
    <div id="header"></div>

    <!-- Main -->
    <main class="auth-main">

        <div class="auth-layout">

            <!-- Sidebar -->
            <div id="mypage-sidebar"></div>


<section class="mypage-content">

    <div class="mypage-title">
        <h1>내 정보</h1>
        <p>BASEBOT 회원님의 활동 정보를 확인할 수 있습니다.</p>
    </div>

    <div class="profile-summary">
        <div class="profile-icon">B</div>

        <div class="profile-info">
            <p class="profile-nickname">
                <span id="profileNickname">회원</span>님
            </p>

            <p class="profile-sub">
                아이디:
                <span id="profileUsername">-</span>
            </p>
        </div>
    </div>

    <div class="mypage-stat-grid">

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">포인트</div>
            <div class="mypage-stat-value" id="userPoint">-</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">등급</div>
            <div class="mypage-stat-value" id="userGrade">-</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">현재 연속 적중</div>
            <div class="mypage-stat-value" id="userPredictionStreak">-</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">최고 연속 적중</div>
            <div class="mypage-stat-value" id="userMaxPredictionStreak">-</div>
        </div>

    </div>

    <div class="mypage-box">

        <div class="mypage-box-title">
            회원 정보
        </div>

        <div class="mypage-box-body">

            <table class="mypage-info-table">

                <tr>
                    <th>아이디</th>
                    <td id="userUsername">-</td>
                </tr>

                <tr>
                    <th>닉네임</th>
                    <td id="userNickname">-</td>
                </tr>

                <tr>
                    <th>이메일</th>
                    <td id="userEmail">-</td>
                </tr>

                <tr>
                    <th>관심 팀</th>
                    <td id="userFavoriteTeam">-</td>
                </tr>

                <tr>
                    <th>회원 등급</th>
                    <td>
                        <span class="grade-badge" id="userGradeBadge">
                            -
                        </span>
                    </td>
                </tr>

            </table>

        </div>
    </div>

</section>


        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- 공통 JS -->
    <script src="/js/main.js"></script>

    <!-- 마이페이지 공통 JS -->
    <script src="/js/mypage.js"></script>



</body>
</html>
