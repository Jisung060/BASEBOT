<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내가 쓴 댓글 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 마이페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/mypage.css">
</head>

<body data-page="my-comments">
    <!-- Header -->
    <div id="header"></div>
    <!-- Main -->
    <main class="auth-main">
        <div class="auth-layout">
            <!-- Sidebar -->
            <div id="mypage-sidebar"></div>

<section class="mypage-content">
    <div class="mypage-title">
        <h1>내가 쓴 댓글</h1>
        <p>커뮤니티에서 내가 작성한 댓글을 확인할 수 있습니다.</p>
    </div>
    <div class="mypage-box">
        <div class="mypage-box-title">
            댓글 목록
        </div>
        <div class="mypage-box-body">
            <ul class="activity-list" id="my-comments-list">
                <li>
                    <span class="activity-title">
                        댓글을 불러오는 중입니다.
                    </span>
                    <span class="activity-date">-</span>
                </li>
            </ul>
        <div id="my-comments-pagination" class="mypage-pagination"></div>
        </div>
    </div>

</section>


        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- 공통 JS -->
    <script src="/js/main.js"></script>

    <!-- 마이페이지 공통 JS -->
    <script src="/js/mypage.js"></script>

    <!-- 내가 쓴 댓글 -->
    <script src="/js/my-comments.js"></script>

</body>
</html>
