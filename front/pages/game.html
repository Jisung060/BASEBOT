<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASEBOT - MLB 경기 일정 및 결과</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/game.css">
</head>
<body>

    <div id="header"></div>

    <main class="main">

        <!-- PAGE TITLE -->
        <section class="page-header">
            <h1>MLB Schedule &amp; Results</h1>
            <p>MLB 경기 일정, 실시간 스코어 및 세이버메트릭스 기록을 확인하세요.</p>
        </section>

        <!-- MLB SEARCH & FILTER BAR -->
        <section class="mlb-search-filter">
            <div class="filter-group">
                <!-- Season Year -->
                <select id="select-year" class="mlb-select">
                    <!-- JS로 동적 생성 -->
                </select>

                <!-- Month -->
                <select id="select-month" class="mlb-select">
                    <!-- JS로 동적 생성 -->
                </select>

                <!-- League / Division Filter -->
                <select id="select-league" class="mlb-select">
                    <option value="ALL" selected>All Leagues</option>
                    <option value="AL">American League</option>
                    <option value="NL">National League</option>
                </select>

                <!-- Team Select -->
                <select id="select-team" class="mlb-select">
                    <option value="ALL" selected>All Teams</option>
                    <!-- JS로 MLB 30개 팀 동적 생성 -->
                </select>
            </div>

            <!-- Date Navigation -->
            <div class="date-nav">
                <button type="button" id="btn-prev-date" class="btn-nav">&lt;</button>
                <input type="date" id="game-date-picker">
                <span id="date-display-text"></span>
                <button type="button" id="btn-next-date" class="btn-nav">&gt;</button>
                <button type="button" id="btn-today" class="btn-today">Today</button>
            </div>
        </section>

        <!-- SCHEDULE TABLE -->
        <section class="mlb-table-container">
            <table class="mlb-schedule-table">
                <thead>
                    <tr>
                        <th class="col-time">Date / Time</th>
                        <th class="col-matchup">Matchup (Away vs Home)</th>
                        <th class="col-venue">Venue</th>
                        <th class="col-status">Status</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <!-- JS에서 API 데이터를 받아 <tr> 요소를 동적으로 추가하는 영역 -->
                <tbody id="game-schedule-tbody">

                    <!-- 1. 경기 종료 (Finished) 템플릿 예시 구조 -->
                    <tr class="game-row status-finished" data-game-id="">
                        <td class="time-cell">
                            <span class="game-time"></span>
                        </td>
                        <td class="match-cell">
                            <div class="team-match">
                                <div class="team-info away">
                                    <img src="" alt="" class="team-logo">
                                    <span class="team-name"></span>
                                </div>
                                <div class="score-box">
                                    <span class="score away-score"></span>
                                    <span class="score-divider">-</span>
                                    <span class="score home-score"></span>
                                </div>
                                <div class="team-info home">
                                    <img src="" alt="" class="team-logo">
                                    <span class="team-name"></span>
                                </div>
                            </div>
                        </td>
                        <td class="venue-cell"></td>
                        <td class="status-cell">
                            <span class="badge badge-finished">Final</span>
                        </td>
                        <td class="action-cell">
                            <a href="" class="btn-action btn-boxscore">Boxscore</a>
                            <a href="" class="btn-action btn-ai-analysis">AI Analysis</a>
                        </td>
                    </tr>

                    <!-- 2. 경기 예정 (Upcoming) 템플릿 예시 구조 -->
                    <tr class="game-row status-upcoming" data-game-id="">
                        <td class="time-cell">
                            <span class="game-time"></span>
                        </td>
                        <td class="match-cell">
                            <div class="team-match">
                                <div class="team-info away">
                                    <img src="" alt="" class="team-logo">
                                    <span class="team-name"></span>
                                    <span class="probable-pitcher"></span>
                                </div>
                                <div class="match-vs">VS</div>
                                <div class="team-info home">
                                    <img src="" alt="" class="team-logo">
                                    <span class="team-name"></span>
                                    <span class="probable-pitcher"></span>
                                </div>
                            </div>
                        </td>
                        <td class="venue-cell"></td>
                        <td class="status-cell">
                            <span class="badge badge-upcoming">Scheduled</span>
                        </td>
                        <td class="action-cell">
                            <a href="" class="btn-action btn-preview">Preview</a>
                            <a href="" class="btn-action btn-ai-predict">AI Predict</a>
                        </td>
                    </tr>

                    <!-- 3. 경기 진행 중 (Live) 템플릿 예시 구조 -->
                    <tr class="game-row status-live" data-game-id="">
                        <td class="time-cell">
                            <span class="game-time"></span>
                        </td>
                        <td class="match-cell">
                            <div class="team-match">
                                <div class="team-info away">
                                    <img src="" alt="" class="team-logo">
                                    <span class="team-name"></span>
                                </div>
                                <div class="score-box">
                                    <span class="score away-score"></span>
                                    <span class="live-inning"></span>
                                    <span class="score home-score"></span>
                                </div>
                                <div class="team-info home">
                                    <img src="" alt="" class="team-logo">
                                    <span class="team-name"></span>
                                </div>
                            </div>
                        </td>
                        <td class="venue-cell"></td>
                        <td class="status-cell">
                            <span class="badge badge-live">LIVE</span>
                        </td>
                        <td class="action-cell">
                            <a href="" class="btn-action btn-live-tracker">Live Tracker</a>
                        </td>
                    </tr>

                </tbody>
            </table>

            <!-- 데이터가 없을 경우 표시되는 영역 -->
            <div id="no-game-message" class="no-data-box" style="display: none;">
                <p>No games scheduled for the selected date.</p>
            </div>
        </section>

    </main>

    <!-- FOOTER (JavaScript로 동적 로드) -->
    <div id="footer"></div>

    <!-- JavaScript -->
    <script src="../js/main.js"></script>
    <script src="../js/game.js"></script>
</body>

</html>
