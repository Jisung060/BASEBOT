<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 | BASEBOT</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/community.css">
</head>
<body>
<div id="header"></div>

<main class="community-main">
    <div class="community-layout">

        <aside class="community-sidebar">
            <div class="community-sidebar-title">커뮤니티</div>
            <div class="community-sidebar-line"></div>
            <nav class="community-sidebar-menu">
                <a href="community.html" class="active">전체 게시글</a>
            </nav>
        </aside>

        <section class="community-content">
            <div class="community-title">
                <h1>커뮤니티</h1>
                <p>야구 팬들과 자유롭게 이야기를 나눠보세요.</p>
            </div>

            <section class="league-filter-card">

                <!-- 검색 박스 -->
                <form class="search-area" onsubmit="return false;">

                    <select id="searchType">
                        <option value="title_content">제목+내용</option>
                        <option value="title">제목</option>
                        <option value="writer">작성자</option>
                    </select>

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="검색어를 입력하세요"
                    >

                    <button
                        type="button"
                        id="postSearchButton"
                        class="community-btn"
                    >
                        검색
                    </button>

                </form>

                <!-- 상세 검색 박스 -->
                <div class="league-filter-grid">

                    <!-- 분류 -->
                    <div>
                        <label for="categorySelect">분류</label>
                        <select id="categorySelect">
                            <option value="">전체 분류</option>
                            <option value="GENERAL">자유</option>
                            <option value="ANALYSIS">분석</option>
                            <option value="GAME_THREAD">경기</option>
                            <option value="NEWS">뉴스</option>
                        </select>
                    </div>

                    <!-- 리그 -->
                    <div>
                        <label for="leagueSelect">리그</label>
                        <select id="leagueSelect">
                            <option value="">전체 리그</option>
                            <option value="AL">아메리칸리그</option>
                            <option value="NL">내셔널리그</option>
                        </select>
                    </div>

                    <!-- 지구 -->
                    <div>
                        <label for="divisionSelect">지구</label>
                        <select id="divisionSelect" disabled>
                            <option value="">전체 지구</option>
                            <option value="EAST">동부</option>
                            <option value="CENTRAL">중부</option>
                            <option value="WEST">서부</option>
                        </select>
                    </div>

                    <!-- 팀 -->
                    <div>
                        <label for="teamSelect">팀</label>
                        <select id="teamSelect" disabled>
                            <option value="">전체 팀</option>
                        </select>
                    </div>

                </div>

                </section>

            <section class="popular-section">
                <div class="section-heading">
                    <div>
                        <span class="section-kicker">HOT</span>
                        <h2>인기 게시글</h2>
                    </div>
                    <span class="section-description">추천과 조회가 많은 게시글</span>
                </div>
                <div class="popular-grid" id="popularGrid">
                </div>
            </section>

            <section class="board-section">
                <div class="board-toolbar">
                    <div class="board-total">
                        전체 게시글 <strong id="boardTotalCount">0</strong>
                    </div>
                    <div class="board-toolbar-right">
                        <select id="sortSelect">
                            <option value="latest">최신순</option>
                            <option value="views">조회순</option>
                            <option value="likes">추천순</option>
                        </select>

                        <a href="community-write.html"
                           class="community-btn primary"
                           id="communityWriteButton">글쓰기</a>

                    </div>
                </div>

                <div class="board">
                    <div class="board-header">
                        <div>번호</div>
                        <div>분류</div>
                        <div>제목</div>
                        <div>작성자</div>
                        <div>날짜</div>
                        <div>조회</div>
                        <div>추천</div>
                    </div>
                    <div id="filterEmptyMessage" class="filter-empty-message" hidden>
                        선택한 리그 / 지구 / 팀에 해당하는 게시글이 없습니다.
                    </div>
                </div>

                <div class="pagination"></div>


            </section>
        </section>
    </div>
</main>

<!-- BASEBOT 공통 팝업 -->
<div id="basebotModal" class="basebot-modal">

    <div class="basebot-modal-box">

        <h3 id="basebotModalTitle"></h3>

        <p id="basebotModalMessage"></p>

        <div class="basebot-modal-button-area">

            <button
                type="button"
                id="basebotModalCancelButton"
                class="community-btn"
                style="display: none;"
            >
                취소
            </button>

            <button
                type="button"
                id="basebotModalButton"
                class="community-btn primary"
            >
                확인
            </button>

        </div>

    </div>

</div>

<div id="footer"></div>
<script src="../js/main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.17/purify.min.js"></script>
<script src="../js/community.js"></script>
</body>
</html>
