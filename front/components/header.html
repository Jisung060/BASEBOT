<!-- ==================================================
    HEADER
================================================== -->

<header class="header">

    <!-- 상단 영역 -->
    <div class="header-top">

        <div class="header-top-inner">

            <div class="header-top-empty"></div>

            <div class="utility-menu">

                <!-- ★ 로그인 시 닉네임 환영 문구 표시 영역 -->
                <span id="userGreetingArea" class="user-greeting" style="display: none;">
                    <strong id="userNicknameText"></strong>님, 안녕하세요
                    <span class="utility-divider">|</span>
                </span>

                <!-- 로그인 / 로그아웃 -->
                <a href="login.html" id="loginLink">
                    로그인
                </a>

                <!-- 회원가입 -->
                <span id="signupArea">
                    <span class="utility-divider">|</span>

                    <a href="signup.html" id="signupLink">
                        회원가입
                    </a>
                </span>

                <!-- 마이페이지 -->
                <span id="mypageArea" style="display: none;">
                    <span class="utility-divider">|</span>
                    <a href="mypage.html" id="mypageLink">
                        마이페이지
                    </a>
                </span>

                <!-- ★ Baseball Savant 스타일 검색창 -->
                <div class="savant-search-wrapper" id="savantSearchWrapper">
                    <div class="savant-search-box" id="savantSearchBox">
                        <span class="savant-floating-label">Search Player Name or Team</span>
                        <input
                            type="text"
                            id="headerSearchInput"
                            placeholder="선수명 또는 구단 검색..."
                            autocomplete="off"
                        >
                        <button type="button" id="headerSearchClear" class="savant-clear-btn" style="display: none;" title="지우기">
                            ✕
                        </button>
                        <button type="button" id="headerSearchBtn" class="savant-search-icon-btn" title="검색">
                            🔍
                        </button>
                    </div>

                    <!-- 실시간 자동완성 드롭다운 결과창 -->
                    <div class="savant-search-dropdown" id="headerSearchDropdown" style="display: none;">
                        <ul class="savant-result-list" id="headerSearchResultList"></ul>
                    </div>
                </div>

            </div>

        </div>

    </div>


    <!-- 메인 메뉴 -->
    <div class="header-main">

        <!-- 로고 -->
        <div class="logo">

            <a href="main.html">
                BASEBOT
            </a>

        </div>


        <!-- 네비게이션 -->
        <nav class="main-nav">

            <a href="community.html">
                커뮤니티
            </a>

            <a href="prediction.html">
                경기 예측
            </a>

            <a href="game.html">
                경기 결과
            </a>

            <a href="standings.html">
                팀 순위
            </a>

            <a href="teams.html">
                팀 정보
            </a>

            <a href="mlb_news.html">
                야구 뉴스
            </a>

            <!-- 관리자: ADMIN에게만 표시 -->
            <a
                href="/admin/dashboard.html"
                id="adminLink"
                style="display: none;"
            >
                관리자
            </a>
        </nav>
    </div>
</header>
