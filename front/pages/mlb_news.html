<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 종합뉴스 - BASEBOT</title>
    <link rel="stylesheet" href="/css/main.css">

    <style>
        .news-section {
            padding: 40px 20px 60px;
            min-height: 600px;
        }
        .board-container {
            max-width: 1100px;
            margin: auto;
        }
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 18px;
        }
        .board-title-group {
            display: flex;
            flex-direction: column;
        }
        .board-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 26px;
            font-weight: 800;
        }
        .board-title:before {
            content: "";
            width: 6px;
            height: 24px;
            background: #0f4c81;
            border-radius: 2px;
        }
        .status-line {
            margin-top: 7px;
            font-size: 12px;
            color: #777;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 5px;
            border-radius: 50%;
            background: #24a148;
        }
        .status-dot.loading {
            background: #d99a00;
        }
        .news-stats {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            color: #666;
            font-size: 12px;
        }
        .news-stats strong {
            color: #0f4c81;
            font-size: 13px;
        }
        .stats-divider { color: #ccc; }
        .refresh-news-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 42px;
            padding: 0 17px;
            border: 1px solid #d7e2ee;
            border-radius: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #f5f9fd 100%);
            color: #17466f;
            box-shadow: 0 3px 10px rgba(18, 58, 92, .07);
            font-size: 13px;
            font-weight: 750;
            letter-spacing: -.2px;
            cursor: pointer;
            transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
        }
        .refresh-news-btn .refresh-icon {
            display: inline-grid;
            place-items: center;
            width: 23px;
            height: 23px;
            border-radius: 7px;
            background: #e7f0f9;
            color: #17466f;
            font-size: 17px;
            line-height: 1;
        }
        .refresh-news-btn:hover {
            border-color: #9dbbd8;
            background: #edf5fc;
            box-shadow: 0 5px 14px rgba(18, 58, 92, .12);
            transform: translateY(-1px);
        }
        .refresh-news-btn:focus-visible,
        .news-admin-shortcut:focus-visible {
            outline: 3px solid rgba(43, 120, 185, .3);
            outline-offset: 3px;
        }
        .refresh-news-btn:disabled { opacity: .65; cursor: wait; transform: none; box-shadow: none; }
        .refresh-news-btn.is-loading .refresh-icon { animation: news-refresh-spin .8s linear infinite; }
        @keyframes news-refresh-spin { to { transform: rotate(360deg); } }
        .news-admin-shortcut {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
            padding: 7px 11px;
            border: 1px solid #d8e2ec;
            border-radius: 8px;
            background: #f5f8fb;
            color: #244967;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }
        .news-admin-shortcut:hover { background: #eaf2f9; border-color: #b7cadd; }

        /* 검색 및 필터 영역 스타일 추가 */
        .news-tools {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            min-width: 0;
        }
        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .team-select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            background-color: #f8f9fa;
        }
        .team-select:focus {
            border-color: #0f4c81;
        }
        .search-input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #0f4c81; }
        .search-btn {
            background-color: #0f4c81;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .search-btn:hover { background-color: #0a355c; }

        .table-wrap {
            overflow-x: auto;
            border-top: 2px solid #222;
        }
        .board-table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            text-align: center;
        }
        .board-table th {
            padding: 14px 8px;
            background: #f7f7f7;
            border-bottom: 1px solid #ccc;
            font-size: 13px;
            font-weight: 800;
        }
        .board-table td {
            padding: 14px 8px;
            border-bottom: 1px solid #e5e5e5;
            font-size: 14px;
            vertical-align: middle;
        }
        .col-no { width: 7%; }
        .col-title { width: auto; text-align: left; }
        .col-ai { width: 125px; }
        .col-date { width: 145px; color: #777; font-size: 12px !important; }

        .title-link {
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: inherit;
        }
        .title-link:hover {
            color: #0f4c81;
            text-decoration: underline;
        }
        .new-badge {
            display: inline-block;
            margin-left: 7px;
            padding: 1px 5px;
            border-radius: 3px;
            background: #d92d20;
            color: white;
            font-size: 10px;
            font-weight: 800;
        }
        .team-badge {
            display: inline-block;
            margin-right: 5px;
            padding: 2px 6px;
            border-radius: 3px;
            background: #e9ecef;
            color: #495057;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #dee2e6;
        }
        .meta {
            margin-top: 4px;
            color: #999;
            font-size: 11px;
            display: flex;
            align-items: center;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .btn-ai, .btn-body {
            padding: 5px 9px;
            background: #fff;
            border: 1px solid #bbb;
            border-radius: 4px;
            color: #333;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-ai:hover, .btn-body:hover {
            border-color: #0f4c81;
            color: #0f4c81;
        }
        .btn-ai:disabled {
            opacity: .55;
            cursor: wait;
        }
        .detail-row { display: none; background: #fafafa; }
        .detail-row td { padding: 0; }
        .detail-box {
            margin: 12px 15px 18px;
            padding: 18px 20px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-left: 4px solid #0f4c81;
            text-align: left;
        }
        .detail-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .detail-meta {
            color: #888;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .article-content {
            white-space: pre-line;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }
        .summary-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8fbff;
            border: 1px solid #dcebf8;
            border-radius: 5px;
        }
        .summary-header {
            margin-bottom: 8px;
            color: #0f4c81;
            font-weight: 800;
        }
        .summary-text {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 13px;
        }
        .loading-message, .error-message {
            padding: 35px 15px;
            text-align: center;
            color: #777;
        }
        .error-message { color: #c62828; }
        .new-row { animation: newArticle .8s ease; }
        @keyframes newArticle { 0% { background: #eef7ff; } 100% { background: #fff; } }


        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .pagination button {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border: 1px solid #d0d5d9;
            background: #fff;
            color: #444;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #0f4c81;
            color: #0f4c81;
        }

        .pagination button.active {
            background: #0f4c81;
            border-color: #0f4c81;
            color: #fff;
        }

        .pagination button:disabled {
            color: #bbb;
            background: #f7f7f7;
            cursor: not-allowed;
        }

        .page-info {
            margin-left: 8px;
            color: #777;
            font-size: 12px;
        }

        @media(max-width:700px) {
            .news-section { padding: 20px 10px 40px; }
            .board-header { align-items: flex-start; flex-direction: column; gap: 15px; }
            .news-tools { width: 100%; align-items: stretch; }
            .refresh-news-btn { width: 100%; }
            .filter-group { width: 100%; flex-wrap: wrap; }
            .search-input { flex-grow: 1; }
        }
    </style>
</head>
<body>

    <div id="header"></div>

    <main class="news-section">
        <div class="board-container">
            <div class="board-header">
                <div class="board-title-group">
                    <h2 class="board-title">MLB 종합뉴스</h2>
                    <div class="status-line">
                        <span id="status-dot" class="status-dot"></span>
                        <span id="status-text">뉴스 목록을 준비하고 있습니다...</span>
                    </div>
                    <div class="news-stats" aria-live="polite">
                        <span>누적 기사 <strong id="total-news-count">0</strong>개</span>
                        <span class="stats-divider">|</span>
                        <span>이번 확인 신규 <strong id="new-news-count">0</strong>개</span>
                        <span class="stats-divider">|</span>
                    </div>
                </div>
                <div class="news-tools">
                    <button id="refresh-news-btn" class="refresh-news-btn" type="button" onclick="loadNews(true)" aria-label="뉴스 새로 확인">
                        <span class="refresh-icon" aria-hidden="true">↻</span>
                        <span>뉴스 새로 확인</span>
                    </button>

                    <!-- 카테고리 필터 및 검색창 영역 -->
                    <div class="filter-group">
                    <select id="team-select" class="team-select" onchange="applyFilters()">
                        <option value="ALL">전체 구단</option>
                        <optgroup label="AL 동부">
                            <option value="양키스">뉴욕 양키스</option>
                            <option value="오리올스">볼티모어 오리올스</option>
                            <option value="레이스">탬파베이 레이스</option>
                            <option value="블루제이스">토론토 블루제이스</option>
                            <option value="레드삭스">보스턴 레드삭스</option>
                        </optgroup>
                        <optgroup label="AL 중부">
                            <option value="트윈스">미네소타 트윈스</option>
                            <option value="가디언스">클리블랜드 가디언스</option>
                            <option value="타이거즈">디트로이트 타이거즈</option>
                            <option value="화이트삭스">시카고 화이트삭스</option>
                            <option value="로열스">캔자스시티 로열스</option>
                        </optgroup>
                        <optgroup label="AL 서부">
                            <option value="애스트로스">휴스턴 애스트로스</option>
                            <option value="레인저스">텍사스 레인저스</option>
                            <option value="매리너스">시애틀 매리너스</option>
                            <option value="에인절스">LA 에인절스</option>
                            <option value="애슬레틱스">오클랜드 애슬레틱스</option>
                        </optgroup>
                        <optgroup label="NL 동부">
                            <option value="브레이브스">애틀랜타 브레이브스</option>
                            <option value="필리스">필라델피아 필리스</option>
                            <option value="말린스">마이애미 말린스</option>
                            <option value="메츠">뉴욕 메츠</option>
                            <option value="내셔널스">워싱턴 내셔널스</option>
                        </optgroup>
                        <optgroup label="NL 중부">
                            <option value="브루어스">밀워키 브루어스</option>
                            <option value="컵스">시카고 컵스</option>
                            <option value="레즈">신시내티 레즈</option>
                            <option value="파이어리츠">피츠버그 파이어리츠</option>
                            <option value="카디널스">세인트루이스 카디널스</option>
                        </optgroup>
                        <optgroup label="NL 서부">
                            <option value="다저스">LA 다저스</option>
                            <option value="다이아몬드백스">애리조나 다이아몬드백스</option>
                            <option value="파드리스">샌디에이고 파드리스</option>
                            <option value="자이언츠">샌프란시스코 자이언츠</option>

                    </select>
                    <input type="text" id="search-input" class="search-input" placeholder="뉴스 제목 검색..." onkeypress="handleSearch(event)">

            <div class="table-wrap">

    <div id="footer"></div>

    <script>
    async function loadComponents() {
        try {
            const headerRes = await fetch('/components/header.html');
            const footerRes = await fetch('/components/footer.html');

            if (headerRes.ok) {
                document.getElementById('header').innerHTML = await headerRes.text();
              updateLoginUI();
            }

            if (footerRes.ok) {
                document.getElementById('footer').innerHTML = await footerRes.text();
            }
        } catch (err) {
            console.error("컴포넌트 로드 실패:", err);
        }
    }

    function readStoredUser() {
        for (const storage of [sessionStorage, localStorage]) {
            try {
                const raw = storage.getItem("user");
                if (!raw) continue;
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === "object") return parsed;
            } catch (error) {
                console.warn("저장된 사용자 정보를 읽을 수 없습니다.", error);
            }
        }
        return null;
    }

    function updateLoginUI() {
        const loginLink = document.getElementById("loginLink");
        const signupArea = document.getElementById("signupArea");
        const mypageArea = document.getElementById("mypageArea");
        const user = readStoredUser();

        // 공통 헤더의 요소가 페이지마다 다르더라도 오류로 스크립트가 중단되지 않게 처리
        if (loginLink) {
            if (user) {
                loginLink.textContent = "로그아웃";
                loginLink.href = "#";
                loginLink.onclick = function (event) {
                    event.preventDefault();
                    sessionStorage.removeItem("user");
                    localStorage.removeItem("user");
                    window.location.href = "/login.html";
                };
            } else {
                loginLink.textContent = "로그인";
                loginLink.href = "/login.html";
                loginLink.onclick = null;
            }
        }
        if (signupArea) signupArea.style.display = user ? "none" : "inline";
        if (mypageArea) mypageArea.style.display = user ? "inline" : "none";

        // 메인 페이지와 동일하게 관리자 계정으로 로그인한 경우에만 메뉴 표시
        const headerRoot = document.getElementById("header");
        if (!headerRoot) return;

        const role = String(
            user?.role ?? user?.user_role ?? user?.authority ?? user?.userRole ?? ""
        ).toUpperCase();

        const username = String(
            user?.username ?? user?.user_name ?? user?.login_id ?? user?.id ?? ""
        ).toLowerCase();

        const isAdmin = role === "ADMIN"
            || user?.is_admin === true
            || user?.isAdmin === true
            || username === "admin";

        const oldShortcut = headerRoot.querySelector(".news-admin-shortcut");
        if (oldShortcut) oldShortcut.remove();

        // 공통 header.html에 관리자 링크가 이미 있으면 로그인 권한에 맞게 표시/숨김 처리
        // header.html의 #adminLink는 기본값이 display:none이므로 반드시 직접 갱신해야 함
        const existingAdminLink = headerRoot.querySelector('#adminLink, a[href*="/admin/"]');
        if (existingAdminLink) {
            existingAdminLink.style.display = isAdmin ? "" : "none";
        }

        // 공통 헤더에 관리자 링크가 없는 페이지에서만 새 링크를 생성
        if (isAdmin && !existingAdminLink) {
            const shortcut = document.createElement("a");
            shortcut.className = "news-admin-shortcut";
            shortcut.href = "/admin/dashboard.html";
            shortcut.textContent = "⚙ 관리자";
            shortcut.setAttribute("aria-label", "관리자 페이지로 이동");

            const target = headerRoot.querySelector(
                ".utility-menu, .header-utility, .header-top-inner, .header"
            ) || headerRoot;
            target.appendChild(shortcut);
        }
    }

    // ============================================================
    // 로그인 상태
    // ============================================================

    function checkLoginStatus() {
        const userJson = localStorage.getItem("user");

        const loginButtonArea = document.getElementById("login-btn-area");
        const userArea = document.getElementById("user-info-area");

        if (userJson) {
            const user = JSON.parse(userJson);

            if (loginButtonArea) {
                loginButtonArea.style.display = "none";
            }

            if (userArea) {
                userArea.style.display = "block";
            }
        } else {
            if (loginButtonArea) {
                loginButtonArea.style.display = "block";
            }

            if (userArea) {
                userArea.style.display = "none";
            }
        }
    }


    loadComponents();


    // ============================================================
    // ============================================================
    // 뉴스 설정
    // ============================================================
    const API_BASE = "";
    let allNewsList = [];
    let filteredNewsList = [];
    let currentPage = 1;
    const ITEMS_PER_PAGE = 15;
    let openedArticleId = null;
    const NEW_WINDOW_HOURS = 24;
    let firstLoad = true;
    let isLoadingNews = false;

    // 페이지 진입 시 한 번만 조회한다. 자동 갱신 타이머는 사용하지 않는다.
    window.addEventListener("DOMContentLoaded", () => {
        loadNews(false);
    });

    // 누적 기사 중 최신 100개까지만 조회한다. 101번째 이후 기사는 화면에 표시하지 않는다.
    async function fetchAllNewsPages() {
        const maxArticles = 100;
        const response = await fetch(
            `${API_BASE}/api/news/mlb?limit=${maxArticles}&page=1`,
            { cache: "no-store" }
        );
        if (!response.ok) throw new Error(`뉴스 API HTTP ${response.status}`);

        const result = await response.json();
        if (result.status !== "success" || !Array.isArray(result.data)) {
            throw new Error("뉴스 API 응답 형식이 올바르지 않습니다.");
        }

        const unique = new Map();
        for (const news of result.data) {
            const id = news.id ?? news.news_id;
            if (id !== undefined && id !== null && !unique.has(String(id))) {
                unique.set(String(id), news);
            }
            if (unique.size >= maxArticles) break;
        }
        return {
            data: Array.from(unique.values()).slice(0, maxArticles),
            totalCount: Number.isFinite(Number(result.total_count))
                ? Number(result.total_count)
                : Array.from(unique.values()).length
        };
    }

    async function loadNews(isRefresh = false) {
        if (isLoadingNews) return;
        isLoadingNews = true;

        const tbody = document.getElementById("news-tbody");
        const status = document.getElementById("status-text");
        const dot = document.getElementById("status-dot");
        const refreshButton = document.getElementById("refresh-news-btn");
        const previousIds = new Set(
            allNewsList.map(news => String(news.id ?? news.news_id))
        );

        status.textContent = isRefresh ? "새 뉴스 확인 및 누적 목록 조회 중..." : "누적 뉴스 목록 불러오는 중...";
        dot.classList.add("loading");
        if (refreshButton) {
            refreshButton.disabled = true;
            refreshButton.classList.add("is-loading");
            refreshButton.innerHTML = '<span class="refresh-icon" aria-hidden="true">↻</span><span>뉴스 확인 중...</span>';
        }

        try {
            const newsResult = await fetchAllNewsPages();
            const newNewsList = newsResult.data;
            const totalCount = newsResult.totalCount;
            const newCount = allNewsList.length === 0
                ? 0
                : newNewsList.filter(news => !previousIds.has(String(news.id ?? news.news_id))).length;

            const oldIds = allNewsList.map(news => String(news.id ?? news.news_id)).join(",");
            const newIds = newNewsList.map(news => String(news.id ?? news.news_id)).join(",");
            const hasNewsChanged = oldIds !== newIds;

            allNewsList = newNewsList;
            document.getElementById("total-news-count").textContent =
                totalCount.toLocaleString("ko-KR");
            document.getElementById("new-news-count").textContent =
                newCount.toLocaleString("ko-KR");

            if (firstLoad || hasNewsChanged) {
                const currentOpenedArticleId = openedArticleId;
                applyFilters(false);
                if (currentOpenedArticleId !== null) {
                    restoreOpenedArticle(currentOpenedArticleId);
                }
            }

            status.textContent =
                `확인 완료 · ${new Date().toLocaleTimeString("ko-KR")} · 최신 기사 최대 100개 표시`;
            dot.classList.remove("loading");
            firstLoad = false;
        } catch (error) {
            console.error("뉴스 조회 실패:", error);
            status.textContent = "뉴스 서버 연결 실패 · FastAPI 서버와 API 경로를 확인해주세요.";
            dot.classList.add("loading");
            if (firstLoad) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="error-message">
                            뉴스 서버에 연결할 수 없습니다.<br>
                            FastAPI 서버와 /api/news/mlb API를 확인해주세요.
                        </td>
                    </tr>
                `;
            }
        } finally {
            isLoadingNews = false;
            if (refreshButton) {
                refreshButton.disabled = false;
                refreshButton.classList.remove("is-loading");
                refreshButton.innerHTML = '<span class="refresh-icon" aria-hidden="true">↻</span><span>뉴스 새로 확인</span>';
            }
        }
    }

// 자동 갱신 후 열려 있던 기사 복원
// ============================================================

function restoreOpenedArticle(newsId) {

    const articleIndex =
        filteredNewsList.findIndex(
            news => Number(news.id ?? news.news_id) === Number(newsId)
        );

    if (articleIndex === -1) {
        return;
    }

    const startIndex =
        (currentPage - 1) * ITEMS_PER_PAGE;

    const pageIndex =
        articleIndex - startIndex;

    if (
        pageIndex < 0 ||
        pageIndex >= ITEMS_PER_PAGE
    ) {
        return;
    }

    const detailRow =
        document.getElementById(
            `detail-row-${pageIndex}`
        );

    const content =
        document.getElementById(
            `article-content-${pageIndex}`
        );

    if (!detailRow || !content) {
        return;
    }

    detailRow.style.display = "table-row";
    content.style.display = "block";

    // 본문은 다시 서버에서 가져오도록 함
    content.dataset.loaded = "false";

    loadArticleContent(
        newsId,
        content
    );
}
    // ============================================================
    // 검색 / 구단 필터
    // ============================================================

    function applyFilters(resetPage = true) {

        const teamFilter =
            document.getElementById("team-select").value;

        const keyword =
            document.getElementById("search-input")
                .value
                .trim()
                .toLowerCase();


        let filteredList = allNewsList;


        // 구단 필터
        if (teamFilter !== "ALL") {

            filteredList = filteredList.filter(news =>
                String(news.title || "").includes(teamFilter)
            );
        }


        // 제목 검색
        if (keyword) {

            filteredList = filteredList.filter(news =>
                String(news.title || "")
                    .toLowerCase()
                    .includes(keyword)
            );
        }


        filteredNewsList = filteredList;


        if (resetPage) {
            currentPage = 1;
        }


        const totalPages = Math.max(
            1,
            Math.ceil(
                filteredNewsList.length / ITEMS_PER_PAGE
            )
        );


        if (currentPage > totalPages) {
            currentPage = totalPages;
        }


        renderCurrentPage();
    }


    // ============================================================
    // 현재 페이지 렌더링
    // ============================================================

    function renderCurrentPage() {

        const tbody =
            document.getElementById("news-tbody");


        if (filteredNewsList.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="loading-message">
                        조건에 맞는 검색 결과가 없습니다.
                    </td>
                </tr>
            `;

            renderPagination();

            return;
        }


        const startIndex =
            (currentPage - 1) * ITEMS_PER_PAGE;


        const pageList =
            filteredNewsList.slice(
                startIndex,
                startIndex + ITEMS_PER_PAGE
            );


        renderNewsBoard(
            pageList,
            tbody,
            startIndex
        );


        renderPagination();
    }


    // ============================================================
    // 페이지네이션
    // ============================================================

    function renderPagination() {

        const pagination =
            document.getElementById("pagination");


        const totalPages =
            Math.ceil(
                filteredNewsList.length /
                ITEMS_PER_PAGE
            );


        pagination.innerHTML = "";


        if (totalPages <= 1) {
            return;
        }


        // 첫 페이지 바로가기 (<<)
        const firstButton = document.createElement("button");
        firstButton.textContent = "«";
        firstButton.title = "첫 페이지";
        firstButton.setAttribute("aria-label", "첫 페이지");
        firstButton.disabled = currentPage === 1;
        firstButton.onclick = () => goToPage(1);
        pagination.appendChild(firstButton);

        // 이전 페이지
        const prevButton =
            document.createElement("button");

        prevButton.textContent = "‹";
        prevButton.title = "이전 페이지";

        prevButton.disabled =
            currentPage === 1;

        prevButton.onclick =
            () => goToPage(currentPage - 1);

        pagination.appendChild(prevButton);


        // 페이지 번호
        let startPage =
            Math.max(1, currentPage - 2);

        let endPage =
            Math.min(totalPages, currentPage + 2);


        if (currentPage <= 3) {
            endPage =
                Math.min(totalPages, 5);
        }


        if (currentPage >= totalPages - 2) {
            startPage =
                Math.max(1, totalPages - 4);
        }


        for (
            let page = startPage;
            page <= endPage;
            page++
        ) {

            const button =
                document.createElement("button");

            button.textContent = page;


            if (page === currentPage) {
                button.classList.add("active");
            }


            button.onclick =
                () => goToPage(page);


            pagination.appendChild(button);
        }


        // 다음 페이지
        const nextButton =
            document.createElement("button");

        nextButton.textContent = "›";
        nextButton.title = "다음 페이지";

        nextButton.disabled =
            currentPage === totalPages;

        nextButton.onclick =
            () => goToPage(currentPage + 1);

        pagination.appendChild(nextButton);

        // 마지막 페이지 바로가기 (>>)
        const lastButton = document.createElement("button");
        lastButton.textContent = "»";
        lastButton.title = "마지막 페이지";
        lastButton.setAttribute("aria-label", "마지막 페이지");
        lastButton.disabled = currentPage === totalPages;
        lastButton.onclick = () => goToPage(totalPages);
        pagination.appendChild(lastButton);

        // 페이지 정보
        const info =
            document.createElement("span");

        info.className = "page-info";

        info.textContent =
            `${currentPage} / ${totalPages} 페이지 · 총 ${filteredNewsList.length}개`;

        pagination.appendChild(info);
    }


    // ============================================================
    // 페이지 이동
    // ============================================================

    function goToPage(page) {

        const totalPages =
            Math.ceil(
                filteredNewsList.length /
                ITEMS_PER_PAGE
            );


        if (
            page < 1 ||
            page > totalPages
        ) {
            return;
        }


        currentPage = page;

        renderCurrentPage();


        document
            .querySelector(".table-wrap")
            .scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
    }


    // ============================================================
    // 검색 엔터
    // ============================================================

    function handleSearch(event) {

        if (event.key === "Enter") {
            applyFilters();
        }
    }


    // ============================================================
    // 뉴스 게시판 출력
    // ============================================================

    function renderNewsBoard(
        list,
        tbody,
        startIndex = 0
    ) {

        tbody.innerHTML = "";


        list.forEach((news, index) => {

            const row =
                document.createElement("tr");


            const globalIndex =
                startIndex + index;


            // 실제 최신 기사만 NEW
            const isNew =
                isLatestNews(
                    news,
                    allNewsList
                );


            if (isNew) {
                row.classList.add("new-row");
            }


            // ====================================================
            // 일반 뉴스 행
            // ====================================================

            row.innerHTML = `

                <td>
                    ${globalIndex + 1}
                </td>


                <td class="col-title">

                    <!--
                        제목 클릭 시 원문 이동이 아니라
                        기사 본문을 바로 펼침
                    -->
                    <a
                        href="javascript:void(0)"
                        class="title-link"
                        onclick="toggleArticle(${news.id}, this, ${index})"
                    >
                        ${escapeHtml(news.title)}
                    </a>


                    ${
                        isNew
                            ? '<span class="new-badge">NEW</span>'
                            : ''
                    }

                </td>


                <td>

                    <div class="action-buttons">

                        <!-- 기존 본문 버튼을 원문사이트 접속으로 변경 -->
                        <button
                            class="btn-body"
                            onclick="openOriginalArticle('${escapeHtml(news.url)}')"
                        >
                            원문사이트 접속
                        </button>


                        <button
                            class="btn-ai"
                            onclick="toggleSummary(${news.id}, this, ${index})"
                        >
                            ✨ 3줄 요약
                        </button>

                    </div>

                </td>


                <td class="col-date">
                    ${escapeHtml(formatDate(news.date))}
                </td>
            `;


            tbody.appendChild(row);


            // ====================================================
            // 기사 상세 행
            // ====================================================

            const detailRow =
                document.createElement("tr");


            detailRow.className =
                "detail-row";


            detailRow.id =
                `detail-row-${index}`;


            detailRow.innerHTML = `

                <td colspan="4">

                    <div class="detail-box">

                        <div class="detail-title">
                            ${escapeHtml(news.title)}
                        </div>


                        <div class="detail-meta">
                            ${escapeHtml(news.author || "MLB Korea")}
                            ·
                            ${escapeHtml(formatDate(news.date))}
                        </div>


                        <!-- 기사 본문 -->
                        <div
                            class="article-content"
                            id="article-content-${index}"
                            style="display:none"
                        ></div>


                        <!-- AI 요약 -->
                        <div
                            class="summary-box"
                            id="summary-box-${index}"
                            style="display:none"
                        >

                            <div class="summary-header">
                                ✨ AI 기사 3줄 요약
                            </div>


                            <div
                                class="summary-text"
                                id="summary-text-${index}"
                            ></div>

                        </div>

                    </div>

                </td>
            `;


            tbody.appendChild(detailRow);

        });


        if (allNewsList.length > 0) {
            firstLoad = false;
        }
    }

// ============================================================
// 기사 본문 가져오기
// ============================================================

async function loadArticleContent(id, content) {

    content.textContent =
        "기사 본문을 불러오는 중...";

    try {

        const response =
            await fetch(
                `${API_BASE}/api/news/mlb/${id}`,
                {
                    cache: "no-store"
                }
            );

        const result =
            await response.json();

        if (
            !response.ok ||
            result.status !== "success"
        ) {
            throw new Error(
                result.detail ||
                "기사 본문 조회 실패"
            );
        }

        content.textContent =
            result.data.content ||
            "기사 본문을 가져오지 못했습니다.";

        content.dataset.loaded = "true";

    } catch (error) {

        console.error(error);

        content.textContent =
            "기사 본문을 불러오지 못했습니다.";
    }
}
    // ============================================================
    // 기사 본문 열기
    // ============================================================

    async function toggleArticle(
    id,
    titleElement,
    index
) {

    const row =
        document.getElementById(
            `detail-row-${index}`
        );

    const content =
        document.getElementById(
            `article-content-${index}`
        );

    const summaryBox =
        document.getElementById(
            `summary-box-${index}`
        );


    // 이미 열려 있으면 닫기
    if (content.style.display === "block") {

        content.style.display = "none";
        summaryBox.style.display = "none";
        row.style.display = "none";

        openedArticleId = null;

        return;
    }


    // 현재 열려 있는 기사 기억
    openedArticleId = id;


    // 본문 열기
    row.style.display = "table-row";
    content.style.display = "block";


    // 이미 불러온 본문이면 다시 요청하지 않음
    if (
        content.dataset.loaded === "true"
    ) {
        return;
    }


    await loadArticleContent(
        id,
        content
    );
}


    // ============================================================
    // 원문 사이트 접속
    // ============================================================

    function openOriginalArticle(url) {

        if (!url) {

            alert(
                "원문 기사 주소가 없습니다."
            );

            return;
        }


        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );
    }


    // ============================================================
    // AI 3줄 요약
    // ============================================================

    async function toggleSummary(
        id,
        button,
        index
    ) {

        const row =
            document.getElementById(
                `detail-row-${index}`
            );


        const content =
            document.getElementById(
                `article-content-${index}`
            );


        const summaryBox =
            document.getElementById(
                `summary-box-${index}`
            );


        const text =
            document.getElementById(
                `summary-text-${index}`
            );


        // ========================================================
        // 이미 열려 있으면 닫기
        // ========================================================

        if (
            summaryBox.style.display === "block"
        ) {

            summaryBox.style.display = "none";

            content.style.display = "none";

            row.style.display = "none";

            button.textContent =
                "✨ 3줄 요약";

            return;
        }


        // ========================================================
        // 요약 열기
        // ========================================================

        row.style.display =
            "table-row";


        summaryBox.style.display =
            "block";


        // 이미 불러온 요약
        if (
            text.dataset.loaded === "true"
        ) {

            button.textContent =
                "요약 닫기";

            return;
        }


        button.disabled = true;

        button.textContent =
            "요약 중...";


        text.textContent =
            "AI가 실제 기사 본문을 분석하고 있습니다...";


        try {

            const response =
                await fetch(
                    `${API_BASE}/api/news/summary/${id}`,
                    {
                        cache: "no-store"
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                result.status !== "success"
            ) {

                throw new Error(
                    result.detail ||
                    "AI 요약 실패"
                );
            }


            text.textContent =
                result.summary;


            text.dataset.loaded =
                "true";


            button.textContent =
                "요약 닫기";


        } catch (error) {

            console.error(error);


            text.textContent =
                `AI 요약 실패: ${error.message}`;


            button.textContent =
                "✨ 3줄 요약";


        } finally {

            button.disabled = false;
        }
    }


    // ============================================================
    // NEW 판정
    // 실제 등록일이 가장 최신인 기사만 NEW
    // ============================================================

    function parseNewsDate(value) {

        if (!value) {
            return null;
        }


        const raw =
            String(value).trim();


        if (!raw) {
            return null;
        }


        let date =
            new Date(raw);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            date =
                new Date(
                    raw.replace(
                        " ",
                        "T"
                    )
                );
        }


        return Number.isNaN(
            date.getTime()
        )
            ? null
            : date;
    }


    function getNewsDate(news) {

        return (
            news?.date ??
            news?.published_at ??
            news?.publishedAt ??
            news?.created_at ??
            news?.createdAt ??
            null
        );
    }


    function isLatestNews(
        news,
        newsList
    ) {

        if (
            !news ||
            !Array.isArray(newsList) ||
            newsList.length === 0
        ) {
            return false;
        }


        const articleDate =
            parseNewsDate(
                getNewsDate(news)
            );


        if (!articleDate) {
            return false;
        }


        const latestTime =
            newsList

                .map(item =>
                    parseNewsDate(
                        getNewsDate(item)
                    )
                )

                .filter(
                    date => date !== null
                )

                .reduce(
                    (
                        max,
                        date
                    ) =>
                        Math.max(
                            max,
                            date.getTime()
                        ),
                    -Infinity
                );


        if (
            latestTime === -Infinity
        ) {
            return false;
        }


        return (
            articleDate.getTime() ===
            latestTime
        );
    }


    // ============================================================
    // 날짜 표시
    // ============================================================

    function formatDate(value) {

        if (!value) {
            return "최근";
        }


        const date =
            new Date(
                value.replace(
                    " ",
                    "T"
                )
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return value;
        }


        return date.toLocaleString(
            "ko-KR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }


    // ============================================================
    // HTML escape
    // ============================================================

    function escapeHtml(value) {

        return String(
            value ?? ""
        )

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );
    }
