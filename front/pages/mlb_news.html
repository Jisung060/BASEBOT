<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 종합뉴스 - BASEBOT</title>
    <!-- 사이트 공통 CSS 링크 (필요시 경로 수정) -->
    <link rel="stylesheet" href="/css/main.css">

    <style>
        /* 뉴스 게시판 전용 스타일 (기존 style 유지하되 body padding 등 조정) */
        .news-section {
            padding: 40px 20px 60px;
            min-height: 600px;
        }
        .board-container {
            max-width: 1100px;
            margin: auto;
        }
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 18px;
        }
        .board-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 26px;
            font-weight: 800;
        }
        .board-title:before {
            content: "";
            width: 6px;
            height: 24px;
            background: #0f4c81;
            border-radius: 2px;
        }
        .status-line {
            margin-top: 7px;
            font-size: 12px;
            color: #777;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 5px;
            border-radius: 50%;
            background: #24a148;
        }
        .status-dot.loading {
            background: #d99a00;
        }
        .btn-external-link {
            background: #f8f9fa;
            border: 1px solid #dcdcdc;
            color: #333;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 5px;
            text-decoration: none;
        }
        .btn-external-link:hover {
            background: #0f4c81;
            color: #fff;
        }
        .table-wrap {
            overflow-x: auto;
            border-top: 2px solid #222;
        }
        .board-table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            text-align: center;
        }
        .board-table th {
            padding: 14px 8px;
            background: #f7f7f7;
            border-bottom: 1px solid #ccc;
            font-size: 13px;
            font-weight: 800;
        }
        .board-table td {
            padding: 14px 8px;
            border-bottom: 1px solid #e5e5e5;
            font-size: 14px;
            vertical-align: middle;
        }
        .col-no { width: 7%; }
        .col-title { width: auto; text-align: left; }
        .col-ai { width: 125px; }
        .col-date { width: 145px; color: #777; font-size: 12px !important; }

        .title-link {
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            color: inherit;
        }
        .title-link:hover {
            color: #0f4c81;
            text-decoration: underline;
        }
        .new-badge {
            display: inline-block;
            margin-left: 7px;
            padding: 1px 5px;
            border-radius: 3px;
            background: #d92d20;
            color: white;
            font-size: 10px;
            font-weight: 800;
        }
        .meta {
            margin-top: 4px;
            color: #999;
            font-size: 11px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .btn-ai, .btn-body {
            padding: 5px 9px;
            background: #fff;
            border: 1px solid #bbb;
            border-radius: 4px;
            color: #333;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-ai:hover, .btn-body:hover {
            border-color: #0f4c81;
            color: #0f4c81;
        }
        .btn-ai:disabled {
            opacity: .55;
            cursor: wait;
        }
        .detail-row { display: none; background: #fafafa; }
        .detail-row td { padding: 0; }
        .detail-box {
            margin: 12px 15px 18px;
            padding: 18px 20px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-left: 4px solid #0f4c81;
            text-align: left;
        }
        .detail-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .detail-meta {
            color: #888;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .article-content {
            white-space: pre-line;
            font-size: 14px;
            line-height: 1.6; /* 1.9에서 1.6으로 수정하여 가독성 개선 */
            color: #333;
        }
        .summary-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8fbff;
            border: 1px solid #dcebf8;
            border-radius: 5px;
        }
        .summary-header {
            margin-bottom: 8px;
            color: #0f4c81;
            font-weight: 800;
        }
        .summary-text {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 13px;
        }
        .loading-message, .error-message {
            padding: 35px 15px;
            text-align: center;
            color: #777;
        }
        .error-message { color: #c62828; }
        .new-row { animation: newArticle .8s ease; }
        @keyframes newArticle { 0% { background: #eef7ff; } 100% { background: #fff; } }

        @media(max-width:700px) {
            .news-section { padding: 20px 10px 40px; }
            .board-header { align-items: flex-start; flex-direction: column; }
            .board-title { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ==================================================
         HEADER (공통 컴포넌트 로드)
    ================================================== -->
    <div id="header"></div>


    <!-- ==================================================
         MAIN CONTENT AREA
    ================================================== -->
    <main class="news-section">
        <div class="board-container">
            <div class="board-header">
                <div>
                    <h2 class="board-title">MLB 종합뉴스</h2>
                    <div class="status-line">
                        <span id="status-dot" class="status-dot"></span>
                        <span id="status-text">실시간 뉴스 연결 중...</span>
                    </div>
                </div>
                <a href="https://www.mlbkor.com/news/articleList.html"
                   target="_blank" rel="noopener noreferrer" class="btn-external-link">MLB 코리아 원문 ↗</a>
            </div>

            <div class="table-wrap">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th class="col-no">번호</th>
                            <th class="col-title">제목</th>
                            <th class="col-ai">기능</th>
                            <th class="col-date">등록일</th>
                        </tr>
                    </thead>
                    <tbody id="news-tbody">
                        <tr><td colspan="4" class="loading-message">최신 뉴스를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>


    <!-- ==================================================
         FOOTER (공통 컴포넌트 로드)
    ================================================== -->
    <div id="footer"></div>


    <!-- ==================================================
         SCRIPTS
    ================================================== -->
    <script>
        // 1. 헤더/푸터 컴포넌트 동적 로드 (main.py의 StaticFiles 경로 사용)
        async function loadComponents() {
            try {
                const headerRes = await fetch('/components/header.html');
                const footerRes = await fetch('/components/footer.html');

                if (headerRes.ok) document.getElementById('header').innerHTML = await headerRes.text();
                if (footerRes.ok) document.getElementById('footer').innerHTML = await footerRes.text();
            } catch (err) {
                console.error("컴포넌트 로드 실패:", err);
            }
        }

        loadComponents();


        // 2. 뉴스 게시판 로직
        const API_BASE = "";
        const REFRESH_MS = 30000;

        let previousIds = new Set();
        let firstLoad = true;

        window.addEventListener("DOMContentLoaded", () => {
            loadNews();
            setInterval(loadNews, REFRESH_MS);
        });

        async function loadNews() {
            const tbody = document.getElementById("news-tbody");
            const status = document.getElementById("status-text");
            const dot = document.getElementById("status-dot");

            status.textContent = "최신 뉴스 확인 중...";
            dot.classList.add("loading");

            try {
                // limit을 50으로 요청
                const response = await fetch(`${API_BASE}/api/news/mlb?limit=50`, {
                    cache: "no-store"
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = await response.json();
                if (result.status !== "success") throw new Error("뉴스 API 응답 오류");

                renderNewsBoard(result.data, tbody);

                status.textContent =
                    `실시간 연결됨 · 마지막 확인 ${new Date().toLocaleTimeString("ko-KR")} · 30초마다 자동 갱신`;
                dot.classList.remove("loading");
            } catch (error) {
                console.error(error);
                status.textContent = "뉴스 서버 연결 실패 · 30초 후 다시 시도합니다.";
                dot.classList.add("loading");

                if (firstLoad) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="error-message">
                                뉴스 서버에 연결할 수 없습니다.<br>
                                FastAPI 서버가 실행 중인지 확인해주세요.
                            </td>
                        </tr>`;
                }
            }
        }

        function renderNewsBoard(list, tbody) {
            tbody.innerHTML = "";

            const currentIds = new Set(list.map(news => String(news.id)));

            list.forEach((news, index) => {
                const row = document.createElement("tr");
                const isNew = !firstLoad && !previousIds.has(String(news.id));

                if (isNew) row.classList.add("new-row");

                row.innerHTML = `
                    <td>${news.number}</td>
                    <td class="col-title">
                        <a href="${escapeHtml(news.url)}" class="title-link" target="_blank" rel="noopener noreferrer">
                            ${escapeHtml(news.title)}
                        </a>
                        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                        <div class="meta">${escapeHtml(news.author || "MLB Korea")}</div>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-body" onclick="toggleArticle(${news.id}, this, ${index})">본문</button>
                            <button class="btn-ai" onclick="toggleSummary(${news.id}, this, ${index})">✨ 3줄 요약</button>
                        </div>
                    </td>
                    <td class="col-date">${escapeHtml(formatDate(news.date))}</td>`;

                tbody.appendChild(row);

                const detailRow = document.createElement("tr");
                detailRow.className = "detail-row";
                detailRow.id = `detail-row-${index}`;
                detailRow.innerHTML = `
                    <td colspan="4">
                        <div class="detail-box">
                            <div class="detail-title">${escapeHtml(news.title)}</div>
                            <div class="detail-meta">
                                ${escapeHtml(news.author || "MLB Korea")} · ${escapeHtml(formatDate(news.date))}
                            </div>
                            <div class="article-content" id="article-content-${index}" style="display:none"></div>
                            <div class="summary-box" id="summary-box-${index}" style="display:none">
                                <div class="summary-header">✨ AI 기사 3줄 요약</div>
                                <div class="summary-text" id="summary-text-${index}"></div>
                            </div>
                        </div>
                    </td>`;

                tbody.appendChild(detailRow);
            });

            previousIds = currentIds;
            firstLoad = false;
        }

        async function toggleArticle(id, button, index) {
            const row = document.getElementById(`detail-row-${index}`);
            const content = document.getElementById(`article-content-${index}`);

            if (row.style.display === "table-row") {
                row.style.display = "none";
                button.textContent = "본문";
                return;
            }

            row.style.display = "table-row";
            button.textContent = "본문 닫기";

            if (content.dataset.loaded === "true") return;

            content.style.display = "block";
            content.textContent = "기사 본문을 불러오는 중...";

            try {
                const response = await fetch(`${API_BASE}/api/news/mlb/${id}`, {
                    cache: "no-store"
                });
                const result = await response.json();

                if (!response.ok || result.status !== "success") {
                    throw new Error(result.detail || "기사 본문 조회 실패");
                }

                content.textContent = result.data.content || "기사 본문을 가져오지 못했습니다.";
                content.dataset.loaded = "true";
            } catch (error) {
                console.error(error);
                content.textContent = "기사 본문을 불러오지 못했습니다.";
            }
        }

        async function toggleSummary(id, button, index) {
            const row = document.getElementById(`detail-row-${index}`);
            const box = document.getElementById(`summary-box-${index}`);
            const text = document.getElementById(`summary-text-${index}`);

            if (box.style.display === "block") {
                box.style.display = "none";
                button.textContent = "✨ 3줄 요약";
                return;
            }

            row.style.display = "table-row";
            box.style.display = "block";

            if (text.dataset.loaded === "true") {
                button.textContent = "요약 닫기";
                return;
            }

            button.disabled = true;
            button.textContent = "요약 중...";
            text.textContent = "AI가 실제 기사 본문을 분석하고 있습니다...";

            try {
                const response = await fetch(`${API_BASE}/api/news/summary/${id}`, {
                    cache: "no-store"
                });
                const result = await response.json();

                if (!response.ok || result.status !== "success") {
                    throw new Error(result.detail || "AI 요약 실패");
                }

                text.textContent = result.summary;
                text.dataset.loaded = "true";
                button.textContent = "요약 닫기";
            } catch (error) {
                console.error(error);
                text.textContent = `AI 요약 실패: ${error.message}`;
                button.textContent = "✨ 3줄 요약";
            } finally {
                button.disabled = false;
            }
        }

        function formatDate(value) {
            if (!value) return "최근";

            const date = new Date(value.replace(" ", "T"));
            if (Number.isNaN(date.getTime())) return value;

            return date.toLocaleString("ko-KR", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>
</body>
</html>
