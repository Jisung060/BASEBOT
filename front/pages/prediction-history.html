<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>예측 기록 | BASEBOT</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- 인증 페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/auth.css">

    <!-- 마이페이지 공통 CSS -->
    <link rel="stylesheet" href="/css/mypage.css">
</head>

<body data-page="prediction-history">

    <!-- Header -->
    <div id="header"></div>

    <!-- Main -->
    <main class="auth-main">

        <div class="auth-layout">

            <!-- Sidebar -->
            <div id="mypage-sidebar"></div>


<section class="mypage-content">

    <div class="mypage-title">
        <h1>예측 기록</h1>
        <p>내가 참여한 경기 예측과 적중 결과를 확인할 수 있습니다.</p>
    </div>

    <div class="mypage-stat-grid">

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">전체 예측</div>
            <div class="mypage-stat-value">0회</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">적중</div>
            <div class="mypage-stat-value">0회</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">실패</div>
            <div class="mypage-stat-value">0회</div>
        </div>

        <div class="mypage-stat-card">
            <div class="mypage-stat-label">적중률</div>
            <div class="mypage-stat-value">0%</div>
        </div>

    </div>

    <div class="mypage-box">

        <div class="mypage-box-title">
            최근 예측 기록
        </div>

        <div class="mypage-box-body">

            <table class="mypage-table">

                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>경기</th>
                        <th>내 예측</th>
                        <th>경기 결과</th>
                        <th>결과</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="5">
                            <div class="mypage-empty">
                                아직 참여한 예측 기록이 없습니다.
                            </div>
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>
    </div>

</section>


        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- 공통 JS -->
    <script src="/js/main.js"></script>

    <!-- 마이페이지 공통 JS -->
    <script src="/js/mypage.js"></script>



</body>
</html>
